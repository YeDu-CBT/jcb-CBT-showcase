    right.appendChild(el('button', {class:'exit-btn', title:'나가기', html:'&times;', onclick:confirmExit}));
    topRow.appendChild(left); topRow.appendChild(right);
    top.appendChild(topRow);
    top.appendChild(el('div', {class:'progress-track'}, [el('div', {class:'progress-fill', id:'exam-progress-fill'})]));
    root.appendChild(top);

    var body = el('div', {class:'exam-body'});
    var main = el('div', {class:'exam-main', id:'exam-main'});
    var navCol = el('div', {class:'exam-nav-col'});
    var navPanel = el('details', {class:'navpanel', open:''});
    var summary = el('summary', {}, [el('span',{text:'문항 이동'}), el('span',{class:'car', text:'▶'})]);
    navPanel.appendChild(summary);
    var legend = el('div', {class:'navlegend'}, [
      el('span', {}, [el('i',{style:'background:var(--surface);'}), document.createTextNode('미답변')]),
      el('span', {}, [el('i',{style:'background:var(--accent-soft);border-color:var(--accent);'}), document.createTextNode('답변완료')]),
      el('span', {}, [el('i',{style:'background:var(--warn);border:none;'}), document.createTextNode('검토표시')])
    ]);
    if(S.mode==='study'){
      // 학습 모드에서만 메모패드가 있고 정답 확인 결과 색이 나타나므로 범례도 이때만 보탠다
      legend.appendChild(el('span', {}, [el('i',{style:'background:var(--memo-mark);border:none;'}), document.createTextNode('메모 있음')]));
      legend.appendChild(el('span', {}, [el('i',{style:'background:#1E8E3E;border-color:#0B5A22;'}), document.createTextNode('정답')]));
      legend.appendChild(el('span', {}, [el('i',{style:'background:#D32F2F;border-color:#8E1414;'}), document.createTextNode('오답·미답')]));
      legend.appendChild(el('span', {}, [el('i',{style:'background:#F0A92E;border-color:#9A6000;'}), document.createTextNode('채점 대기')]));
    }
    navPanel.appendChild(legend);
    var qgrid = el('div', {class:'qgrid', id:'exam-qgrid'});
    navPanel.appendChild(qgrid);
    navCol.appendChild(navPanel);
    if(S.mode === 'study'){                                          // 학습 모드에서만 메모패드
      navCol.appendChild(buildMemoResizer());
      navCol.appendChild(buildMemoPanel());
    }

    body.appendChild(main);
    body.appendChild(navCol);
    root.appendChild(body);
    applyMemoLayout();

    renderQuestion();
    renderNavGrid();
    if(S.timeLimitSec>0) updateTimerDisplay();
  }

  function updateTopProgress(){
    var answeredCount = Object.keys(S.answers).filter(function(k){ return S.answers[k] && S.answers[k].trim().length>0; }).length;
    $('#exam-progress-text').textContent = (S.idx+1) + ' / ' + S.pool.length + '  ·  답변 ' + answeredCount + '/' + S.pool.length;
    $('#exam-progress-fill').style.width = (answeredCount/S.pool.length*100) + '%';
  }

  /* 학습 모드에서 '정답 확인/정답 보기'를 이미 누른 문항만 채점 결과 색을 돌려준다.
     correct -> result-correct(초록) / wrong·unanswered -> result-wrong(빨강) / pending(자가채점 대기) -> result-pending(주황)
     아직 확인하지 않은 문항, 그리고 실전 모드(결과는 제출 후에 공개)는 빈 문자열 = 색 변화 없음. */
  var NAV_STATUS_LABEL = {correct:'정답', wrong:'오답', unanswered:'미답변', pending:'자가채점 대기'};
  function navStatusOf(q){
    if(S.mode!=='study' || !S.revealed[q.id]) return '';
    return computeStatus(effQ(q), S.answers[q.id] || '', S.selfMarks[q.id]);
  }

  function renderNavGrid(){
    var grid = $('#exam-qgrid');
    if(!grid) return;
    grid.innerHTML = '';
    var memos = S.mode === 'study' ? loadMemos() : null;
    S.pool.forEach(function(q,i){
      var classes = ['nav-'+i];
      var st = navStatusOf(q);
      if(i===S.idx) classes.push('current');
      if(st){
        classes.push(st==='correct' ? 'result-correct' : (st==='pending' ? 'result-pending' : 'result-wrong'));
      } else if(i!==S.idx && S.answers[q.id] && S.answers[q.id].trim().length>0){
        classes.push('answered');
      }
      if(S.flagged[q.id]) classes.push('flagged');
      var hasMemo = !!memos && hasMemoNow(q.id, memos);
      if(hasMemo) classes.push('has-memo');
      var label = navLabelText(i, st, hasMemo);
      var btn = el('button', {type:'button', class:classes.join(' '), text:String(i+1), 'aria-label':label, title:label, onclick:function(){
        S.idx = i; renderQuestion(); renderNavGrid();
      }});
      if(memos) btn.appendChild(el('i', {class:'memo-mark', 'aria-hidden':'true'}));      // 하늘색 사각형(has-memo 일 때만 보인다)
      grid.appendChild(btn);
    });
  }

  function renderQuestion(){
    memoCommit();                          // 문항을 옮기기 전에 쓰던 메모를 먼저 저장
    var q = effQ(currentQ());
    var main = $('#exam-main');
    main.innerHTML = '';
    updateTopProgress();

    var card = el('div', {class:'card q-card'});
    var head = el('div', {class:'q-head'});
    var headLeft = el('div', {class:'q-head-left'}, [el('span', {class:'q-num', text:'Q' + (S.idx+1)})]);
    appChips(q).forEach(function(c){ headLeft.appendChild(c); });          // 출제 연도·회차·번호(여러 회차에 나온 문제는 모두)
    simChips(q).forEach(function(c){ headLeft.appendChild(c); });          // 비슷하지만 정답이 다른 문제의 연도·회차(합치지 않음)
    headLeft.appendChild(el('span', {class:'chip', text: q.language}));
    headLeft.appendChild(el('span', {class:'chip grading-chip ' + q.grading, text: q.grading==='exact' ? '완전일치 자동채점' : '서술형 자가채점'}));
    if(q.difficulty){
      headLeft.appendChild(el('span', {class:'chip', text:'난이도 ' + q.difficulty}));
    }
    head.appendChild(headLeft);
    head.appendChild(el('button', {class:'flag-btn', type:'button', 'aria-pressed':String(!!S.flagged[q.id]), html:(S.flagged[q.id]?'&#9873; 검토표시됨':'&#9872; 검토표시'), onclick:function(){
      S.flagged[q.id] = !S.flagged[q.id];
      renderQuestion(); renderNavGrid();
    }}));
    card.appendChild(head);

    if(hasVariants(baseOf(q))) card.appendChild(buildVerTabs(baseOf(q), q));

    card.appendChild(buildPromptNode(q));

    var codeNode = buildCodeOrTable(q);
    if(q.code && q.code.trim()){
      card.appendChild(buildCopyTools(q, function(){
        var shown = S.mode==='study' && !!S.revealed[q.id];
        return {mine: S.answers[q.id] || '', reveal: shown, status: shown ? (NAV_STATUS_LABEL[navStatusOf(q)] || '') : ''};
      }));
    }
    if(codeNode) card.appendChild(codeNode);

    var isRevealed = S.mode==='study' && !!S.revealed[q.id];
    var curValue = S.answers[q.id] || '';

    var answerWrap = el('div', {class:'answer-wrap'});
    answerWrap.appendChild(el('span', {class:'answer-label', text: q.answer_parts ? '내 답안 (번호별로 입력)' : '내 답안'}));
    if(q.answer_parts){
      answerWrap.appendChild(buildAnswerFields(q, curValue, {
        disabled: isRevealed,
        mark: isRevealed && q.grading === 'exact',
        onChange: function(v){ S.answers[q.id] = v; updateTopProgress(); }
      }));
    } else {
      var useTextarea = curValue.indexOf('\n')>-1 || (q.answer||'').indexOf('\n')>-1 || (q.answer||'').length>40;
      var inputEl = el(useTextarea?'textarea':'input', Object.assign({class:'answer-input'}, useTextarea?{}:{type:'text'}));
      inputEl.value = curValue;
      inputEl.disabled = isRevealed;
      inputEl.placeholder = '정답을 입력하세요';
      inputEl.addEventListener('input', function(){
        S.answers[q.id] = inputEl.value;
        updateTopProgress();
      });
      answerWrap.appendChild(inputEl);
    }
    card.appendChild(answerWrap);

    if(S.mode==='study'){
      var checkRow = el('div', {class:'check-row'});
      if(!isRevealed){
        checkRow.appendChild(el('button', {class:'btn btn-primary', text: q.grading==='exact' ? '정답 확인' : '정답 보기', onclick:function(){
          S.revealed[q.id] = true;
          renderQuestion(); renderNavGrid();
        }}));
      }
      card.appendChild(checkRow);

      if(isRevealed){
        card.appendChild(buildRevealBlock(q, curValue,
          function(){ return S.selfMarks[q.id]; },
          function(v){ S.selfMarks[q.id] = v; },
          function(){ renderQuestion(); renderNavGrid(); }
        ));
      }
    }

    main.appendChild(card);
    applyHighlight(card);

    var footer = el('div', {class:'q-footer'});
    footer.appendChild(el('button', {class:'btn', text:'← 이전', disabled: S.idx===0?'':null, onclick:function(){ S.idx--; renderQuestion(); renderNavGrid(); }}));
    if(S.idx < S.pool.length-1){
      footer.appendChild(el('button', {class:'btn btn-primary', text:'다음 →', onclick:function(){ S.idx++; renderQuestion(); renderNavGrid(); }}));
    } else {
      footer.appendChild(el('button', {class:'btn btn-primary', text:'제출하기', onclick:confirmSubmit}));
    }
    main.appendChild(footer);
    syncMemoPanel();
    focusAnswerInput();
  }

  /* 정답/모범답안 + 해설 블록. exact는 정답/오답 표시, self는 모범답안 + 맞음/틀림 버튼.
     getMark/setMark/onMarked로 "어디서 호출됐는지"(시험 중 학습모드 vs 결과화면 리뷰카드)에 따라
     마크를 어디에 저장하고 어떻게 다시 그릴지를 분리한다 — 결과화면에서는 #exam-main이 아예
     없으므로 renderQuestion()을 그대로 재사용하면 안 된다. */
  function buildRevealBlock(q, inputValue, getMark, setMark, onMarked){
    var wrap = el('div');
    if(q.grading === 'exact'){
      var isCorrect = gradeExact(q, inputValue);
      var expBox = el('div', {class:'explain-box'});
      expBox.appendChild(el('div', {class:'exp-title', text: (isCorrect?'정답입니다 · ':(inputValue&&inputValue.trim()?'오답입니다 · ':'미답변 · ')) + '해설'}));
      expBox.appendChild(el('div', {class:'model-answer-box'}, [
        el('div', {class:'ma-title', text:'정답'}),
        el('div', {class:'ma-value', text:modelAnswerText(q)})
      ]));
      if(q.answer_alts && q.answer_alts.length){
        expBox.appendChild(el('div', {class:'ma-alts', text:'이 표기도 정답으로 인정: ' + q.answer_alts.map(function(a){ return altAnswerText(q, a); }).join('   ·   ')}));
      }
      if(q.explanation){
        expBox.appendChild(buildExplNode(q));
      }
      wrap.appendChild(expBox);
    } else {
      var mark = getMark();
      var box = el('div', {class:'explain-box'});
      box.appendChild(el('div', {class:'exp-title', text:'모범답안 (서술형 — 직접 비교해 채점하세요)'}));
      box.appendChild(el('div', {class:'model-answer-box'}, [
        el('div', {class:'ma-title', text:'모범답안'}),
        el('div', {class:'ma-value', text:modelAnswerText(q)})
      ]));
      if(q.explanation){
        box.appendChild(buildExplNode(q));
      }
      var sgRow = el('div', {class:'self-grade-row'}, [
        el('button', {class:'btn sg-correct', type:'button', 'aria-pressed':String(mark===true), text:'✓ 맞았음', onclick:function(){
          setMark(true); onMarked();
        }}),
        el('button', {class:'btn sg-wrong', type:'button', 'aria-pressed':String(mark===false), text:'✗ 틀렸음', onclick:function(){
          setMark(false); onMarked();
        }})
      ]);
      box.appendChild(sgRow);
      wrap.appendChild(box);
    }
    return wrap;
  }

  function exitToHome(){
    if(S.timerHandle){ clearInterval(S.timerHandle); S.timerHandle=null; }
    goHome();
  }
  function confirmExit(){
    openModal({
      title:'풀이를 종료할까요?',
      body:'저장하지 않은 진행 상황은 사라집니다. [저장하고 나가기]를 누르면 지금까지의 답안과 보던 위치를 ' + (SYNC.state === 'on' ? '저장하고(같은 계정의 다른 기기에도 올라갑니다)' : '이 브라우저에 저장하고') + ', 나중에 처음 화면의 \'이어서 풀기\'에서 이어갈 수 있습니다.',
      cancelText:'계속 풀기',
      confirmText:'저장 없이 종료',
      altText:'저장하고 나가기',
      onConfirm:exitToHome,
      onAlt:function(){ trySave(exitToHome); }
    });
  }

  function confirmSubmit(){
    var answeredCount = Object.keys(S.answers).filter(function(k){ return S.answers[k] && S.answers[k].trim().length>0; }).length;
    var unanswered = S.pool.length - answeredCount;
    var body = unanswered>0
      ? ('아직 답변하지 않은 문항이 ' + unanswered + '개 있습니다. 그래도 제출하시겠습니까?')
      : '모든 문항에 답변했습니다. 제출하고 결과를 확인하시겠습니까?';
    openModal({
      title:'답안 제출',
      body: body,
      cancelText:'계속 풀기',
      confirmText:'제출하기',
      onConfirm: function(){ submitExam(); }
    });
  }

  function submitExam(){
    if(S.timerHandle){ clearInterval(S.timerHandle); S.timerHandle=null; }
    var elapsedSec = S.timeLimitSec>0 ? (S.timeLimitSec - Math.max(0,S.remainingSec)) : Math.round((Date.now()-S.startedAt)/1000);

    var results = S.pool.map(function(base){
      var q = effQ(base);                      // 제출 때 선택돼 있던 판으로 채점한다
      var inputValue = S.answers[q.id] || '';
      var selfMark = S.selfMarks[q.id];
      var status = computeStatus(q, inputValue, selfMark);
      return {q:q, inputValue:inputValue, selfMark:selfMark, status:status, flagged: !!S.flagged[q.id]};
    });

    var exactResults = results.filter(function(r){ return r.q.grading==='exact'; });
    var selfResults = results.filter(function(r){ return r.q.grading==='self'; });
    var examCorrect = exactResults.filter(function(r){ return r.status==='correct'; }).length;
    var examCount = exactResults.length;
    var scorePct = examCount>0 ? Math.round(examCorrect/examCount*100) : 0;
    var submittedAt = Date.now();

    S.result = {
      results: results,
      examCount: examCount,
      examCorrect: examCorrect,
      scorePct: scorePct,
      selfCount: selfResults.length,
      total: S.pool.length,
      elapsedSec: elapsedSec,
      ts: submittedAt,
      sourceLabel: S.sourceLabel
    };

    saveHistoryEntry({
      ts: submittedAt,
      sourceLabel: S.sourceLabel,
      total: S.pool.length,
      examCount: examCount,
      examCorrect: examCorrect,
      scorePct: scorePct,
      selfCount: selfResults.length,
      mode: S.mode,
      elapsedSec: elapsedSec,
      results: results.map(function(r){
        var rec = { qid:r.q.id, inputValue:r.inputValue, selfMark:r.selfMark, status:r.status, flagged:r.flagged };
        if(r.q._verKey) rec.ver = r.q._verKey;           // 어느 언어 판으로 풀었는지(언어 판이 있는 문항만)
        return rec;
      })
    });

    removeSave(S.sessionId);      // 제출한 풀이는 '기록'으로 옮겨졌으므로 중간 저장본은 지운다
    S.sessionId = null;

    S.resultFilter = 'all';
    renderResult();
    showScreen('result');
  }

  /* ===========================================================
     RESULT 화면
  =========================================================== */
  function renderResult(){
    var root = $('#screen-result');
    root.innerHTML = '';
    var r = S.result;

    var hero = el('div', {class:'card result-hero'});
    var hasExam = r.examCount>0;
    var pass = hasExam && r.scorePct>=60;
    var circ = 2*Math.PI*50;
    var offset = hasExam ? circ * (1 - r.scorePct/100) : circ;
    var ringColor = hasExam ? (pass ? 'var(--good)' : 'var(--bad)') : 'var(--line)';
    var svgWrap = el('div', {class:'score-ring-wrap'});
    svgWrap.innerHTML =
      '<svg viewBox="0 0 120 120">' +
        '<circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="10"/>' +
        '<circle cx="60" cy="60" r="50" fill="none" stroke="'+ringColor+'" stroke-width="10" stroke-linecap="round" ' +
          'stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'"/>' +
      '</svg>' +
      '<div class="score-ring-num"><span class="pct">'+(hasExam?r.scorePct:'—')+'</span><span class="pctsign">'+(hasExam?'%':'')+'</span></div>';
    hero.appendChild(svgWrap);

    var meta = el('div', {class:'result-meta'});
    if(hasExam){
      meta.appendChild(el('span', {class:'chip ' + (pass?'chip-good':'chip-bad'), text: pass ? '참고 합격선 통과 (60%+)' : '참고 합격선 미달 (60%)'}));
    }
    meta.appendChild(el('h2', {text: r.sourceLabel.split(' · ')[0] + ' 결과'}));
    var stats = el('div', {class:'result-stats'}, [
      statTile(r.examCorrect, '자동채점 정답'),
      statTile(r.examCount - r.examCorrect, '자동채점 오답/미답'),
      statTile(r.selfCount, '서술형(자가채점)'),
      statTile(fmtDuration(r.elapsedSec), '소요 시간')
    ]);
    meta.appendChild(stats);
    meta.appendChild(el('div', {class:'result-note', text:'정보처리기사 실기는 100점 만점에 60점 이상 합격입니다. 위 참고 합격선은 완전일치 자동채점 문항만을 기준으로 계산한 것으로, 실제 시험 배점·구성과 다를 수 있습니다. 서술형 문항은 모범답안을 보고 직접 채점해 주세요.'}));

    var wrongTotal = r.results.filter(function(x){ return x.status==='wrong' || x.status==='unanswered'; }).length;
    var actions = el('div', {class:'result-actions'}, [
      el('button', {class:'btn btn-primary', text:'오답만 다시 풀기 (' + wrongTotal + ')', disabled: wrongTotal===0 ? '' : null, onclick:retryWrongOnly}),
      el('button', {class:'btn', text:'같은 조건으로 다시', onclick:startSession}),
      el('button', {class:'btn', text:'처음으로', onclick:goHome})
    ]);
    meta.appendChild(actions);
    hero.appendChild(meta);
    root.appendChild(hero);

    var breakdownBox = buildBreakdownBox(r);
    if(breakdownBox) root.appendChild(breakdownBox);

    var filterBar = el('div', {class:'filter-bar'});
    var counts = {
      all: r.results.length,
      wrong: r.results.filter(function(x){return x.status==='wrong' || x.status==='unanswered';}).length,
      correct: r.results.filter(function(x){return x.status==='correct';}).length,
      pending: r.results.filter(function(x){return x.status==='pending';}).length,
      flagged: r.results.filter(function(x){return x.flagged;}).length
    };
    [['all','전체 '+counts.all],['wrong','오답/미답변 '+counts.wrong],['correct','정답 '+counts.correct],['pending','자가채점 대기 '+counts.pending],['flagged','검토표시 '+counts.flagged]].forEach(function(pair){
      filterBar.appendChild(el('button', {type:'button', 'data-filter':pair[0], 'aria-pressed':String(S.resultFilter===pair[0]), text:pair[1], onclick:function(){
        applyResultFilter(pair[0]);
      }}));
    });
    root.appendChild(filterBar);

    var list = el('div', {id:'result-list'});
    root.appendChild(list);
    renderResultList();
  }

  function statTile(n, label){
    return el('div', {class:'stat-tile'}, [el('div',{class:'n mono', text:String(n)}), el('div',{class:'l', text:label})]);
  }

  /* ISTQB의 "실러버스 챕터별 분포" 대신 — 사용자 결정: 연도·회차 / 언어 이중 축으로 오답 분포 집계 */
  function buildBreakdownBox(r){
    var wrongItems = r.results.filter(function(x){ return x.status==='wrong' || x.status==='unanswered'; });
    if(wrongItems.length===0) return null;

    function groupBy(keyFn, labelFn){
      var map = {};
      wrongItems.forEach(function(item){
        var k = keyFn(item.q);
        if(!map[k]) map[k] = {label: labelFn(item.q), count:0};
        map[k].count++;
      });
      return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return b.count-a.count; });
    }

    var byRound = groupBy(function(q){ return appKey(appsOf(q)[0]); }, function(q){ var a = appsOf(q)[0]; return a.year+'년 '+a.round+'회'; });   // 여러 회차에 나온 문제는 처음 출제된 회차에 한 번만 센다
    var anyMulti = wrongItems.some(function(x){ return appsOf(x.q).length > 1; });
    var byLang = groupBy(function(q){ return q.language; }, function(q){ return q.language; });

    var box = el('div', {class:'card chapter-summary'});
    box.appendChild(el('div', {class:'cs-head'}, [
      el('div', {class:'cs-title', text:'📖 오답/미답변 분포 (연도·회차 / 언어)'}),
    ]));
    box.appendChild(el('div', {class:'cs-hint', text:'오답이 어느 회차·언어에 몰려 있는지 보여줍니다.' + (anyMulti ? ' (여러 회차에 나온 같은 문제는 처음 출제된 회차에 한 번만 셉니다.)' : '')}));

    function buildTable(rows, colLabel){
      var table = el('table', {class:'cs-table'});
      table.appendChild(el('tr', {}, [el('th', {text:colLabel}), el('th', {text:'오답 수'}), el('th', {text:'비율'})]));
      var tbody = el('tbody');
      rows.forEach(function(row){
        var pct = Math.round(row.count / wrongItems.length * 100);
        tbody.appendChild(el('tr', {}, [
          el('td', {text:row.label}),
          el('td', {class:'center mono', text:String(row.count)}),
          el('td', {class:'center mono', text:pct+'%'})
        ]));
      });
      table.appendChild(tbody);
      return table;
    }

    box.appendChild(el('div', {class:'cs-subhead', text:'연도 · 회차별'}));
    box.appendChild(buildTable(byRound, '회차'));
    box.appendChild(el('div', {class:'cs-subhead', text:'언어별'}));
    box.appendChild(buildTable(byLang, '언어'));
    return box;
  }

  function applyResultFilter(mode){
    S.resultFilter = mode;
    $all('.filter-bar button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-filter')===mode));
    });
    renderResultList();
  }

  function renderResultList(){
    var list = $('#result-list');
    if(!list) return;
    list.innerHTML = '';
    var r = S.result;
    var items = r.results;
    if(S.resultFilter==='wrong') items = items.filter(function(x){return x.status==='wrong' || x.status==='unanswered';});
    else if(S.resultFilter==='correct') items = items.filter(function(x){return x.status==='correct';});
    else if(S.resultFilter==='pending') items = items.filter(function(x){return x.status==='pending';});
    else if(S.resultFilter==='flagged') items = items.filter(function(x){return x.flagged;});

    if(items.length===0){
      list.appendChild(el('div', {class:'empty-note', text:'해당하는 문항이 없습니다.'}));
      return;
    }

    items.forEach(function(item){
      var card = buildReviewCard(item, r.results.indexOf(item));
      list.appendChild(card);
      applyHighlight(card);
    });
  }

  function buildReviewCard(item, indexInAll){
    var q = item.q;
    var card = el('div', {class:'card review-card'});
    var head = el('div', {class:'q-head'});
    var headLeft = el('div', {class:'q-head-left'}, [el('span', {class:'q-num', text:'Q' + (indexInAll+1)})]);
    appChips(q).forEach(function(c){ headLeft.appendChild(c); });
    simChips(q).forEach(function(c){ headLeft.appendChild(c); });
    headLeft.appendChild(el('span', {class:'chip', text: q.language}));
    if(q._blog) headLeft.lastChild.appendChild(blogDot(true));       // 참고 사이트(sssinga) 출처 판이면 빨간 점
    var qApps = appsOf(q);
    if(qApps.length > 1){                                            // 여러 회차에 나온 문제: 회차마다 원문 글 링크
      qApps.forEach(function(a){
        var rm = ROUNDS_META_BY_KEY[appKey(a)];
        if(rm && rm.source_url) headLeft.appendChild(el('a', {class:'src-link', href:rm.source_url, target:'_blank', rel:'noopener noreferrer', text:'원문 보기(' + a.year + '년 ' + a.round + '회) ↗'}));
      });
    } else if(q.source_url) headLeft.appendChild(el('a', {class:'src-link', href:q.source_url, target:'_blank', rel:'noopener noreferrer', text:'원문 보기 ↗'}));
    if(q._blog && q.blog_url && q.blog_url !== q.source_url) headLeft.appendChild(el('a', {class:'src-link', href:q.blog_url, target:'_blank', rel:'noopener noreferrer', text:'참고 사이트 보기 ↗'}));
    if(item.flagged) headLeft.appendChild(el('span', {class:'chip chip-warn', text:'검토표시'}));
    head.appendChild(headLeft);
    var statusChip;
    if(item.status==='unanswered') statusChip = el('span', {class:'chip chip-warn', text:'미답변'});
    else if(item.status==='correct') statusChip = el('span', {class:'chip chip-good', text:'정답'});
    else if(item.status==='wrong') statusChip = el('span', {class:'chip chip-bad', text:'오답'});
    else statusChip = el('span', {class:'chip chip-warn', text:'자가채점 대기'});
    head.appendChild(statusChip);
    card.appendChild(head);

    card.appendChild(buildPromptNode(q));

    var codeNode2 = buildCodeOrTable(q);
    if(q.code && q.code.trim()){
      card.appendChild(buildCopyTools(q, function(){
        return {mine: item.inputValue || '', reveal: true, status: NAV_STATUS_LABEL[item.status] || ''};
      }));
    }
    if(codeNode2) card.appendChild(codeNode2);

    var answerWrap = el('div', {class:'answer-wrap'});
    answerWrap.appendChild(el('span', {class:'answer-label', text:'내가 입력한 답안'}));
    if(q.answer_parts){
      answerWrap.appendChild(buildAnswerFields(q, item.inputValue, {
        disabled: true,
        mark: q.grading === 'exact' && item.status !== 'unanswered'
      }));
    } else {
      var shown = el(item.inputValue.indexOf('\n')>-1 ? 'textarea':'input', {class:'answer-input', disabled:''});
      shown.value = item.inputValue || '(미답변)';
      answerWrap.appendChild(shown);
    }
    card.appendChild(answerWrap);

    card.appendChild(buildRevealBlock(q, item.inputValue,
      function(){ return item.selfMark; },
      function(v){
        item.selfMark = v;
        item.status = computeStatus(q, item.inputValue, v);
      },
      function(){ renderResult(); }
    ));

    return card;
  }

  function retryWrongOnly(){
    var wrongItems = S.result.results.filter(function(x){ return x.status==='wrong' || x.status==='unanswered'; });
    var wrongQs = wrongItems.map(function(x){ return baseOf(x.q); });
    if(wrongQs.length===0) return;
    S.pool = S.shuffle ? shuffleArr(wrongQs) : wrongQs.slice();
    S.idx = 0;
    S.answers = {};
    S.selfMarks = {};
    S.revealed = {};
    S.flagged = {};
    S.verSel = {};                              // 틀린 그 언어 판으로 다시 푼다
    S.ansByVer = {};
    wrongItems.forEach(function(x){ if(x.q._verKey) S.verSel[baseOf(x.q).id] = x.q._verKey; });
    S.startedAt = Date.now();
    S.timeLimitSec = 0;
    S.remainingSec = 0;
    S.sourceLabel = '오답 다시풀기 (' + wrongQs.length + '문항)';
    S.sessionId = newSessionId();
    if(S.timerHandle){ clearInterval(S.timerHandle); S.timerHandle=null; }
    renderExam();
    showScreen('exam');
  }

  /* ===========================================================
     연습 기록 상세보기
  =========================================================== */
  function viewHistoryEntry(hEntry){
    if(!hEntry.results || !hEntry.results.length) return;
    var results = hEntry.results.map(function(sr){
      var q = ALL_Q_BY_ID[sr.qid];
      if(!q) return null;
      q = viewOf(q, sr.ver);                    // 풀었던 언어 판으로 보여준다(예전 기록은 ver 가 없어 기본 판)
      return { q:q, inputValue:sr.inputValue||'', selfMark:sr.selfMark, status:sr.status, flagged:!!sr.flagged };
    }).filter(function(x){ return x; });
    if(results.length===0) return;

    S.sourceLabel = hEntry.sourceLabel;
    S.mode = hEntry.mode || S.mode;
    S.result = {
      results: results,
      examCount: hEntry.examCount,
      examCorrect: hEntry.examCorrect,
      scorePct: hEntry.scorePct,
      selfCount: hEntry.selfCount,
      total: hEntry.total,
      elapsedSec: hEntry.elapsedSec,
      ts: hEntry.ts,
      sourceLabel: hEntry.sourceLabel
    };
    S.resultFilter = 'all';
    renderResult();
    showScreen('result');
  }

  /* keyboard nav */
  document.addEventListener('keydown', function(e){
    if(S.screen !== 'exam') return;
    var tg = e.target;
    if(tg && (tg.tagName==='TEXTAREA' || tg.tagName==='INPUT' || tg.tagName==='SELECT' || tg.isContentEditable)) return; // 입력 중엔 방향키로 답 입력 방해하지 않음(메모 편집창 포함)
    if(e.defaultPrevented) return;
    if(tg && tg.closest && tg.closest('#memo-panel, #memo-resizer')) return;      // 메모 도구줄·너비 손잡이에서 누른 방향키로 문항이 넘어가지 않게
    if(e.key==='ArrowRight' && S.idx < S.pool.length-1){ S.idx++; renderQuestion(); renderNavGrid(); }
    else if(e.key==='ArrowLeft' && S.idx>0){ S.idx--; renderQuestion(); renderNavGrid(); }
  });

})();
</script>
