<meta charset="UTF-8">
<title>정보처리기사 실기 CBT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --bg:#F3F7FD;
    --surface:#FFFFFF;
    --surface-2:#E6EFFB;
    --ink:#101820;
    --ink-muted:#2B3A55;
    --ink-faint:#5C6B86;
    --line:#B4C7E3;
    --line-strong:#7F9DB9;
    --accent:#245EDC;
    --accent-strong:#0B3C9E;
    --accent-soft:#DCE8FB;
    --accent-ink:#FFFFFF;
    --good:#0A6B1E;
    --good-soft:#E3F3DE;
    --good-line:#2E8B3E;
    --bad:#C4161C;
    --bad-soft:#FDE6E6;
    --bad-line:#C4161C;
    --warn:#A85A00;
    --warn-soft:#FFF1DA;
    --warn-line:#CC8A3D;
    --memo-mark:#46B6F2;
    --shadow: none;
    color-scheme: light;
  }

  *{box-sizing:border-box}
  /* html,body에 height:100%를 주지 않는다 — ISTQB 사이트 제작 때 확인한 sticky 헤더 버그와 동일한
     이유. body/html은 내용 길이에 맞춰 자동으로 늘어나야(height:auto, 기본값) sticky가 문서 끝까지
     정상 동작한다. */
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'맑은 고딕','Malgun Gothic','굴림',Gulim,'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif;
    font-size:13.5px;
    line-height:1.55;
  }
  .mono{font-family:'Courier New',monospace; font-variant-numeric: tabular-nums;}
  a{color:var(--accent); text-decoration:underline;}
  a:visited{color:#551A8B}
  button{font-family:inherit; font-size:inherit; cursor:pointer;}
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within{
    outline:2px dotted var(--ink); outline-offset:2px;
  }
  h1,h2,h3{margin:0}
  [hidden]{display:none!important}

  #app{max-width:960px; margin:0 auto; padding-inline:16px; padding-block:20px 60px;}

  /* ---------- 공통 헤더 (ISTQB 사이트와 동일한 패턴: sticky + 클릭 시 처음 화면) ---------- */
  .app-header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:var(--bg); border-bottom:2px solid var(--line-strong); cursor:pointer;
  }
  .app-header:hover{ background:var(--surface-2); }
  .app-header:focus-visible{ outline:2px dotted var(--ink); outline-offset:-3px; }
  .app-header-inner{
    max-width:960px; margin:0 auto; padding:6px 16px 18px;
  }
  .app-header-eyebrow{
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--accent-strong); font-weight:700; display:block; margin-bottom:8px;
  }
  /* 작은 글씨(eyebrow) 옆에 버전 표시: 한 줄에 나란히, 좁은 화면에서는 eyebrow만 줄바꿈 */
  .app-header-top{display:flex; align-items:baseline; gap:4px 10px; margin-bottom:8px;}
  .app-header-top .app-header-eyebrow{margin-bottom:0; min-width:0;}
  .app-header-ver{
    flex:none; white-space:nowrap; font-family:'Courier New',monospace; font-size:10px; font-weight:700;
    letter-spacing:0; text-transform:none; line-height:15px; padding:0 5px;
    color:var(--ink); background:var(--accent-soft); border:1px solid var(--line-strong);
  }
  .app-header-title{display:block; font-size:24px; font-weight:700; color:var(--accent-strong);}

  /* ---------- shared bits ---------- */
  .eyebrow{
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--accent-strong); font-weight:700;
  }
  .card{
    background:var(--surface); border:1px solid var(--line-strong); border-radius:0;
    box-shadow:none;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 16px; border-radius:0; border:2px outset #E9E7DF;
    background:#D4D0C8; color:var(--ink); font-weight:normal; font-size:13px;
    transition:none;
    white-space:nowrap;
  }
  .btn:hover{background:#DEDBD2}
  .btn:active{border-style:inset}
  .btn[disabled]{opacity:.5; cursor:not-allowed}
  .btn-primary{background:var(--accent); border-color:#6699FF; color:var(--accent-ink); font-weight:bold;}
  .btn-primary:hover{background:var(--accent-strong)}
  .btn-ghost{background:transparent; border:2px solid transparent}
  .btn-ghost:hover{background:var(--surface-2); border-color:transparent}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:0}
  .btn-block{width:100%}

  .chip{
    display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:0;
    font-size:11px; font-weight:700; font-family:'Courier New',monospace; letter-spacing:0;
    border:1px solid var(--line-strong); color:var(--ink-muted); background:var(--surface-2);
  }
  .chip-good{background:var(--good-soft); color:var(--good); border-color:var(--good-line)}
  .chip-bad{background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line)}
  .chip-warn{background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line)}
  .chip-accent{background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent)}
  /* 비슷하지만 정답이 다른 문제(합치지 않음)가 출제된 연도·회차 — 실제 출제 칩과 헷갈리지 않게 점선·연노랑 */
  .chip.sim-chip{background:#FFF8E1; color:#6B4A00; border:1px dashed #C79A2B; font-weight:600;}

  /* ---------- HOME ---------- */
  .home-header{padding-block:14px 18px; margin-bottom:6px;}
  .home-header p{color:var(--ink-muted); margin:0; max-width:60ch}

  .rule-note{
    display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:0;
    background:#FFFFCC; border:1px solid #CC0000; color:#000; font-size:12.5px; margin-block:16px 22px;
  }
  .rule-note b{color:#CC0000}

  .section-title{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted);
    margin:26px 0 10px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); padding-bottom:6px;
  }
  .section-title .num{
    width:18px;height:18px;border-radius:0;background:var(--accent);color:var(--accent-ink);
    display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-family:'Courier New',monospace;
    border:1px solid var(--accent-strong);
  }

  /* 연도/회차 · 언어 이중 필터 */
  .filter-block{margin-bottom:14px;}
  .filter-block-label{font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .round-grid, .lang-grid{display:flex; flex-wrap:wrap; gap:6px;}
  .round-chip, .lang-chip{
    padding:6px 10px; border:1px solid var(--line-strong); background:var(--surface); font-size:12px;
    font-family:'Courier New',monospace; color:var(--ink-muted); border-radius:0;
  }
  .lang-chip{font-family:inherit; font-weight:700; padding:6px 12px;}
  .round-chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink); font-weight:700;}
  .lang-chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg);}
  .filter-reset{font-size:11.5px; color:var(--accent); background:none; border:none; text-decoration:underline; padding:2px 0; cursor:pointer;}
  .filter-count{font-size:12.5px; color:var(--ink-muted); margin-top:10px;}
  .filter-count b{color:var(--accent-strong); font-family:'Courier New',monospace;}

  .config-card{padding:18px; margin-top:10px;}
  .config-row{display:flex; flex-direction:column; gap:8px; padding-block:14px; border-top:1px solid var(--line);}
  .config-row:first-child{border-top:none; padding-top:2px;}
  .config-label{font-size:13px; font-weight:700; display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .config-label .val{font-family:'Courier New',monospace; color:var(--accent-strong); font-weight:700;}
  .config-hint{font-size:11.5px; color:var(--ink-faint)}

  .seg{display:flex; gap:6px; flex-wrap:wrap;}
  .seg button{
    flex:1 1 auto; padding:8px 10px; border-radius:0; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink-muted); font-size:13px; font-weight:700; min-width:64px;
  }
  .seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink);}

  input[type="range"]{
    width:100%; height:20px;
  }

  .history-list{display:flex; flex-direction:column; gap:6px;}
  .history-row{
    display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:0;
    background:var(--surface); border:1px solid var(--line); font-size:12.5px;
  }
  .history-row .hr-date{color:var(--ink-faint); font-family:'Courier New',monospace; font-size:11px; min-width:76px;}
  .history-row .hr-src{font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .history-row .hr-score{font-family:'Courier New',monospace; font-weight:700;}
  .history-row.history-row-clickable{cursor:pointer;}
  .history-row.history-row-clickable:hover{background:var(--accent-soft); border-color:var(--accent);}
  .history-row.history-row-clickable:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .history-row .hr-arrow{color:var(--accent-strong); font-weight:700; font-size:11px;}
  .empty-note{color:var(--ink-faint); font-size:12.5px; padding:10px 2px;}

  .start-bar{position:sticky; bottom:0; padding-top:16px; margin-top:8px; background:linear-gradient(var(--bg-t,transparent),var(--bg) 30%);}

  /* ---------- EXAM ---------- */
  #screen-exam{max-width:none; margin:0 auto; padding-inline:0;}
  /* 문제 풀이·결과 화면은 코드·표가 가로 스크롤 없이 들어가도록 홈보다 넓게 쓴다(홈은 960px 그대로) */
  #app[data-screen="exam"]{max-width:1360px;}
  #app[data-screen="result"]{max-width:1100px;}
  html[data-screen="exam"] .app-header-inner{max-width:1360px;}      /* 상단 제목도 본문과 왼쪽 선을 맞춘다 */
  html[data-screen="result"] .app-header-inner{max-width:1100px;}
  .exam-top{
    position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--app-header-h, 46px)); z-index:20;
    background:var(--surface); border-bottom:2px solid var(--line-strong);
    padding:10px 16px; display:flex; flex-direction:column; gap:8px;
  }
  .exam-top-row{display:flex; align-items:center; gap:10px; justify-content:space-between;}
  .exam-top-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .exam-progress-text{font-family:'Courier New',monospace; font-size:13px; font-weight:700; white-space:nowrap;}
  .exam-top-right{display:flex; align-items:center; gap:10px;}
  .timer{
    font-family:'Courier New',monospace; font-size:15px; font-weight:700; padding:4px 10px;
    border-radius:0; background:var(--surface-2); border:1px solid var(--line-strong); min-width:64px; text-align:center;
  }
  .timer.warn{background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line)}
  .timer.bad{background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line)}
  .exit-btn{background:none;border:none;color:var(--ink-faint);font-size:18px;padding:4px 6px;line-height:1}
  .exit-btn:hover{color:var(--ink)}

  .progress-track{height:6px; background:var(--surface-2); border-radius:0; border:1px solid var(--line-strong); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:0; transition:width .2s;}

  .exam-body{display:flex; gap:18px; padding:16px; align-items:flex-start;}
  .exam-main{flex:1; min-width:0;}
  .exam-nav-col{width:250px; flex-shrink:0;}

  .q-card{padding:20px;}
  .q-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .q-head-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .q-num{font-family:'Courier New',monospace; font-weight:700; font-size:15px; color:var(--accent-strong);}
  .flag-btn{
    display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:0;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-muted); font-size:12px; font-weight:700;
    word-break:keep-all;   /* 좁은 화면에서 칩이 늘어도 '검토표시'가 글자 중간에서 끊기지 않게(2026-10-12) */
  }
  .flag-btn[aria-pressed="true"]{background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn);}

  .q-prompt{font-size:15px; line-height:1.75;}
  .q-prompt.plain{white-space:pre-wrap;}
  /* 지문 블록(지시문/본문/보기/표/그림). 박스 = "다음/아래"가 가리키는 본문·보기·그림을 네모칸에 */
  .pb-block{margin:0 0 10px;}
  .pb-line{margin:0 0 2px; overflow-wrap:anywhere; white-space:pre-wrap;}
  .pb-opt{padding-left:18px;}
  .pb-box{border:1px solid var(--line-strong); background:var(--surface); padding:10px 14px; margin:2px 0 12px;}
  .pb-box .pb-block:last-child{margin-bottom:0;}
  .pb-figure{text-align:center;}
  .pb-img{display:block; max-width:100%; height:auto; margin:4px auto 2px;}
  .pb-cap{font-size:11px; color:var(--ink-faint); line-height:1.4; margin-top:2px;}
  .pb-table-wrap{overflow-x:auto; max-width:100%; margin:2px 0 12px;}
  .pb-table-cap{font-size:13.5px; font-weight:700; margin:0 0 4px;}
  .pb-table{border-collapse:collapse; font-size:13px; line-height:1.5; background:var(--surface); width:auto; max-width:100%;}
  .pb-table th,.pb-table td{border:1px solid var(--line-strong); padding:4px 10px; text-align:left; vertical-align:top; white-space:pre-wrap; overflow-wrap:anywhere;}
  .pb-table th{background:var(--surface-2); font-weight:700;}
  .expl-line{margin:0 0 2px;}
  .src-link{font-size:11.5px; margin-left:4px;}

  .q-code{background:var(--surface-2); border:1px solid var(--line); margin:14px 0; overflow-x:auto;}
  /* 가로 스크롤 대신 줄바꿈: 넓은 화면에서는 대부분 한 줄에 들어가고, 모바일처럼 좁을 때만 긴 줄이 접힌다 */
  .q-code pre{margin:0; padding:10px 12px; background:transparent!important; white-space:pre-wrap; overflow-wrap:anywhere;}
  .q-code pre code, .q-code pre code.hljs{background:transparent!important; font-family:'Courier New',monospace; font-size:14.5px; line-height:1.55; padding:0;}
  /* highlight.js 문법 강조 — cdnjs의 테마 CSS(stylesheet)는 artifact 환경에서 막히므로
     라이브러리 스크립트가 만드는 표준 토큰 클래스에 직접 색을 입힌다(이 사이트 팔레트에 맞춤). */
  .hljs{color:var(--ink);}
  .hljs-comment,.hljs-quote{color:var(--ink-faint); font-style:italic;}
  .hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type,.hljs-doctag{color:var(--accent-strong); font-weight:700;}
  .hljs-string,.hljs-regexp{color:var(--good);}
  .hljs-number{color:var(--warn);}
  .hljs-title,.hljs-section,.hljs-built_in,.hljs-name,.hljs-selector-id,.hljs-selector-class{color:var(--accent); font-weight:700;}
  .hljs-variable,.hljs-template-variable,.hljs-attr,.hljs-attribute,.hljs-params{color:#8B4513;}
  .hljs-symbol,.hljs-bullet,.hljs-link{color:var(--bad);}
  .hljs-meta{color:var(--ink-faint);}
  .hljs-deletion{background:var(--bad-soft);}
  .hljs-addition{background:var(--good-soft);}
  .hljs-emphasis{font-style:italic;}
  .hljs-strong{font-weight:700;}

  .grading-chip.exact{background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent);}
  .grading-chip.self{background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line);}

  .answer-wrap{margin-top:18px;}
  .answer-label{font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:6px; display:block;}
  .answer-input{
    display:block; width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--line-strong);
    border-radius:0; font-family:'Courier New',monospace; font-size:13.5px; background:var(--surface); color:var(--ink);
    resize:vertical;
  }
  .answer-input:disabled{background:var(--surface-2); color:var(--ink-muted);}
  /* 번호별 답안란: ( 1 ) ( 2 ) 처럼 번호가 있는 문항은 번호마다 칸을 따로 둔다 */
  .answer-parts{display:grid; grid-template-columns:max-content minmax(0,1fr); gap:8px 10px; align-items:center; max-width:680px;}   /* 칸 이름 열 폭을 맞춰 입력칸의 왼쪽 선이 가지런하다 */
  .ap-row{display:contents;}
  .ap-label{flex:0 0 auto; min-width:48px; text-align:center; padding:7px 8px; font-family:'Courier New',monospace; font-weight:700; font-size:13px;
    color:var(--accent-strong); background:var(--accent-soft); border:1px solid var(--accent);}
  .ap-row .answer-input{flex:1; min-width:0;}
  .answer-input.ap-ok{border-color:var(--good-line); background:var(--good-soft); color:var(--good);}
  .answer-input.ap-ng{border-color:var(--bad-line); background:var(--bad-soft); color:var(--bad);}
  textarea.answer-input{min-height:78px; line-height:1.6; white-space:pre;}

  .model-answer-box{margin-top:14px; padding:14px 15px; border:1px solid var(--line-strong); background:var(--surface-2);}
  .model-answer-box .ma-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:6px;}
  .model-answer-box .ma-value{font-family:'Courier New',monospace; font-size:13.5px; white-space:pre-wrap; font-weight:700; color:var(--accent-strong);}
  .ma-alts{margin-top:8px; font-family:'Courier New',monospace; font-size:12.5px; color:var(--ink-faint); white-space:pre-wrap; overflow-wrap:anywhere;}

  .self-grade-row{display:flex; gap:8px; margin-top:12px;}
  .self-grade-row button{flex:1;}
  .self-grade-row button.sg-correct[aria-pressed="true"]{background:var(--good-soft); border-color:var(--good-line); color:var(--good);}
  .self-grade-row button.sg-wrong[aria-pressed="true"]{background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad);}

  .check-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}

  .explain-box{
    margin-top:14px; padding:14px 15px; border-radius:0; background:var(--surface-2);
    border:1px solid var(--line-strong); font-size:13.5px; line-height:1.7; color:var(--ink); white-space:pre-wrap;
  }
  .explain-box .exp-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:6px; white-space:normal;}

  .q-footer{display:flex; justify-content:space-between; gap:10px; margin-top:20px;}

  /* nav grid */
  .navpanel{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--app-header-h, 46px) + 78px);}
  .navpanel summary{
    list-style:none; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--ink-muted);
    display:flex; align-items:center; justify-content:space-between; padding:4px 2px 10px;
  }
  .navpanel summary::-webkit-details-marker{display:none}
  .navpanel summary .car{transition:none}
  .navpanel[open] summary .car{transform:rotate(90deg)}
  .navlegend{display:flex; flex-wrap:wrap; gap:8px; font-size:10.5px; color:var(--ink-faint); margin-bottom:10px;}
  .navlegend span{display:inline-flex; align-items:center; gap:4px}
  .navlegend i{width:9px;height:9px;border-radius:0; display:inline-block; border:1px solid var(--line-strong);}
  .qgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(34px,1fr)); gap:6px;}
  .qgrid button{
    aspect-ratio:1; border-radius:0; border:1px solid var(--line-strong); background:var(--surface);
    color:var(--ink-muted); font-family:'Courier New',monospace; font-size:11.5px; font-weight:700; padding:0;
    position:relative;
  }
  .qgrid button.answered{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong);}
  .qgrid button.current{background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink);}
  .qgrid button.flagged::after{
    content:""; position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:0;
    background:var(--warn); border:1px solid var(--surface);
  }
  /* 메모가 있는 문항(학습 모드): 오른쪽 아래의 하늘색 작은 사각형. 검토표시(오른쪽 위 적갈색)·정오 기호(왼쪽 위)와 자리가 겹치지 않는다. */
  .qgrid button .memo-mark{
    display:none; position:absolute; bottom:-3px; right:-3px; width:8px; height:8px; border-radius:0;
    background:var(--memo-mark); border:1px solid var(--surface); pointer-events:none;
  }
  .qgrid button.has-memo .memo-mark{display:block;}
  /* 학습 모드에서 '정답 확인/정답 보기'를 누른 문항: 정답=초록, 오답·미답=빨강, 자가채점 대기=주황.
     색만으로는 적록색약 사용자가 구분하기 어려우므로 왼쪽 위에 ✓ ✗ ? 기호를 함께 붙인다. */
  .qgrid button.result-correct{background:#1E8E3E; border-color:#0B5A22; color:#fff;}
  .qgrid button.result-wrong{background:#D32F2F; border-color:#8E1414; color:#fff;}
  .qgrid button.result-pending{background:#F0A92E; border-color:#9A6000; color:#3D2400;}
  .qgrid button.result-correct::before,
  .qgrid button.result-wrong::before,
  .qgrid button.result-pending::before{
    position:absolute; top:1px; left:3px; font-size:8px; line-height:1; font-weight:700; font-family:inherit;
  }
  .qgrid button.result-correct::before{content:"\2713";}
  .qgrid button.result-wrong::before{content:"\2717";}
  .qgrid button.result-pending::before{content:"?";}
  /* 지금 보고 있는 문항이 채점된 상태라면, 채점 색은 그대로 두고 겹 테두리로 '현재 위치'를 표시 */
  .qgrid button.current.result-correct,
  .qgrid button.current.result-wrong,
  .qgrid button.current.result-pending{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent-strong);}

  @media (max-width:1180px){
    .exam-body{flex-direction:column; align-items:stretch; padding:12px;}
    .exam-main{width:100%; max-width:100%;}
    .exam-nav-col{width:100%;}
    .navpanel{position:static;}
  }

  /* ---------- RESULT ---------- */
  .result-hero{padding:22px; display:flex; gap:22px; align-items:center; flex-wrap:wrap;}
  .score-ring-wrap{position:relative; width:118px; height:118px; flex-shrink:0;}
  .score-ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .score-ring-num{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Courier New',monospace;
  }
  .score-ring-num .pct{font-size:24px; font-weight:700; line-height:1;}
  .score-ring-num .pctsign{font-size:11px; color:var(--ink-faint);}
  .result-meta{flex:1; min-width:200px;}
  .result-meta h2{font-size:19px; margin-bottom:4px; color:var(--accent-strong);}
  .result-note{font-size:11.5px; color:var(--ink-faint); margin-top:6px; max-width:52ch;}
  .result-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:10px; margin-top:16px;}
  .stat-tile{padding:10px 12px; border-radius:0; background:var(--surface-2); border:1px solid var(--line-strong);}
  .stat-tile .n{font-family:'Courier New',monospace; font-weight:700; font-size:18px;}
  .stat-tile .l{font-size:11px; color:var(--ink-muted); margin-top:2px;}

  .result-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

  .chapter-summary{padding:16px; margin-top:20px;}
  .chapter-summary .cs-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .chapter-summary .cs-title{font-size:13px; font-weight:700; margin-bottom:0; color:var(--accent-strong);}
  .chapter-summary .cs-hint{font-size:11.5px; color:var(--ink-faint); margin-bottom:10px;}
  .cs-export-btn{font-size:11.5px; padding:6px 10px; white-space:nowrap; flex-shrink:0;}
  .cs-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:18px;}
  .cs-table:last-child{margin-bottom:0;}
  .cs-table th,.cs-table td{border:1px solid var(--line-strong); padding:6px 8px; text-align:left;}
  .cs-table th{background:var(--surface-2); font-weight:700; text-align:center;}
  .cs-table td.center{text-align:center;}
  .cs-table tr:nth-child(even) td{background:#EAF2FF}
  .cs-table tbody tr.cs-row-clickable{cursor:pointer;}
  .cs-table tbody tr.cs-row-clickable:hover td{background:var(--accent-soft);}
  .cs-subhead{font-size:11px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; margin:14px 0 6px;}
  .cs-subhead:first-of-type{margin-top:0;}

  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 14px; position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--app-header-h, 46px)); background:var(--bg); padding-block:8px; z-index:10;}
  .filter-bar button{padding:6px 12px; border-radius:0; border:1px solid var(--line-strong); background:var(--surface); font-size:12.5px; font-weight:700; color:var(--ink-muted);}
  .filter-bar button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg);}

  .review-card{padding:16px; margin-bottom:12px;}
  .review-card .q-head{margin-bottom:10px;}
  .review-toggle{font-size:12px; color:var(--accent); font-weight:700; background:none; border:none; padding:6px 0; margin-top:10px; text-decoration:underline;}

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:100;
  }
  .modal-box{
    background:var(--surface); border-radius:0; padding:22px; max-width:380px; width:100%;
    box-shadow:none; border:2px solid var(--line-strong);
  }
  .modal-box.modal-box-wide{max-width:640px;}
  .modal-box h3{font-size:16px; margin-bottom:8px;}
  .modal-box p{font-size:13.5px; color:var(--ink-muted); line-height:1.6; margin:0 0 18px;}
  .modal-actions{display:flex; gap:8px; align-items:center; justify-content:flex-end;}
  .copy-textarea{
    display:block; width:100%; box-sizing:border-box; resize:vertical;
    min-height:260px; max-height:55vh; margin-bottom:14px;
    font-family:'Courier New',monospace; font-size:12.5px; line-height:1.6; white-space:pre-wrap;
    padding:10px; border:1px solid var(--line-strong); border-radius:0; color:var(--ink); background:var(--surface-2);
  }
  .copy-feedback{font-size:12px; font-weight:700; margin-right:auto;}

  .loading{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; color:var(--ink-faint); gap:10px; text-align:center;}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation-duration:2s} }

  /* ---------- 구린맛 추가요소 (ISTQB 사이트와 톤 통일) ---------- */
  @keyframes blinker{ 50%{ opacity:0; } }
  .blink{ animation:blinker 1s step-start infinite; }

  @keyframes marquee-scroll{
    from{ left:100%; }
    to{ left:-100%; }
  }
  .marquee-wrap{
    position:relative; overflow:hidden; white-space:nowrap; background:#000080; border:2px solid #FFFF00;
    height:2.4em; margin-block:14px 0;
  }
  .marquee-wrap .marquee-text{
    position:absolute; left:100%; top:50%; transform:translateY(-50%);
    white-space:nowrap; color:#FFFF00; font-weight:bold; font-size:12.5px;
    animation:marquee-scroll 16s linear infinite;
  }

  .rainbow-rule{
    height:5px; margin:0; border:1px solid #000; border-left:none; border-right:none;
    background:repeating-linear-gradient(90deg,#FF0000 0 8px,#FF9900 8px 16px,#FFEB00 16px 24px,#22CC22 24px 32px,#0066FF 32px 40px,#9900CC 40px 48px);
  }

  .hitcounter{
    display:inline-flex; align-items:center; gap:8px; background:#000; border:2px inset #999; padding:6px 10px;
  }
  .hitcounter .lbl{color:#fff; font-size:11px; font-weight:700;}
  .hitcounter .digits{
    font-family:'Courier New',monospace; background:#001A00; color:#33FF33; font-weight:700;
    letter-spacing:3px; padding:3px 8px; font-size:14px; border:1px solid #33FF33;
  }

  .retro-footer{
    margin-top:30px; padding-top:14px; border-top:2px dashed var(--line-strong); text-align:center; font-size:11px; color:var(--ink-muted);
  }
  .retro-footer .badges{margin-bottom:8px;}
  .badge-optimized{
    display:inline-block; border:1px solid #000; background:#FFFFCC; padding:2px 7px; font-size:10px; margin:0 3px;
  }

  /* =====================================================================
     2026-10 스킨: Windows XP(Luna 파랑) + 2000년대 한국 포털/게시판 감성
     - 위쪽 :root 토큰이 기본 색(파랑 테마)이고, 아래는 부품별 모양(그라데이션·테두리·둥근 모서리)만 입힌다.
     - 동작·레이아웃 규칙은 건드리지 않았다(같은 선택자를 뒤에서 덮어쓰기).
     ===================================================================== */
  :root{
    --page-bg:#CFE0F7;
    --xp-blue-1:#4F9BFF;   /* 제목 막대 위쪽 밝은 파랑 */
    --xp-blue-2:#245EDC;   /* XP Luna 대표 파랑 */
    --xp-blue-3:#0B3C9E;   /* 짙은 파랑 */
    --xp-border:#7F9DB9;   /* XP 컨트롤 테두리 */
    --btn-grad:linear-gradient(#FFFFFF 0%, #F6F5F1 45%, #ECEBE5 85%, #D8D2C6 100%);
    --blue-grad:linear-gradient(#62A8FA 0%, #2A72E0 48%, #1C5CCB 52%, #2A70DE 100%);
    --bar-grad:linear-gradient(#58A0F8 0%, #2672DE 48%, #1B5CC8 52%, #2870DC 100%);
    --panel-grad:linear-gradient(#F4F8FE, #DCE8FA);
  }
  html{scrollbar-color:#6F9DE8 #E3ECFA;}
  ::selection{background:#316AC5; color:#fff;}
  body{
    background-color:var(--page-bg);
    background-image:linear-gradient(180deg, #2C6BD3 0, #5C93E6 140px, #A9C7F0 420px, #CFE0F7 760px);
    background-repeat:no-repeat;
    font-family:Tahoma,'돋움',Dotum,'맑은 고딕','Malgun Gothic','굴림',Gulim,'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif;
  }
  /* 가운데 흰 페이지(고정폭 포털 느낌) */
  #app{background:var(--bg); border-inline:1px solid #5E86C4; box-shadow:0 0 12px rgba(0,30,100,.45);}
  a{color:#0B4FC4;}

  /* ---- 맨 위 헤더: 반짝이는(글로시) 파란 로고 띠 ---- */
  .app-header{
    background:linear-gradient(#9CC8FC 0%, #5EA2F4 20%, #2A72E0 42%, #1B58C8 62%, #0F46A8 100%);
    border-bottom:3px solid #0A2F7A; box-shadow:0 2px 5px rgba(0,20,80,.45);
  }
  .app-header::after{content:""; position:absolute; inset:0 0 55% 0; pointer-events:none;
    background:linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.02));}
  .app-header:hover{background:linear-gradient(#9CC8FC 0%, #5EA2F4 20%, #2A72E0 42%, #1B58C8 62%, #0F46A8 100%); filter:brightness(1.08);}
  .app-header-inner{position:relative; z-index:1; padding:5px 16px 10px;}
  .app-header-eyebrow{color:#08266A; font-family:inherit; font-size:11px; font-weight:700; letter-spacing:.02em; text-transform:none; margin-bottom:3px; text-shadow:0 1px 0 rgba(255,255,255,.55);}
  .app-header-top{gap:4px 8px; margin-bottom:3px;}
  .app-header-ver{font-family:inherit; font-size:10px; color:#08266A; background:rgba(255,255,255,.9); border:1px solid #0A2F7A; border-radius:8px; padding:0 7px; text-shadow:none; box-shadow:inset 0 1px 0 #fff;}
  .app-header-title{color:#fff; font-size:26px; font-weight:800; font-style:italic; letter-spacing:-.5px;
    text-shadow:1px 1px 0 #0A2F7A, 0 0 10px rgba(255,255,255,.35);}
  .app-header:focus-visible{outline:2px dotted #fff; outline-offset:-4px;}

  /* ---- 홈 소개 박스 / 안내(말풍선) ---- */
  .home-header{background:var(--panel-grad); border:1px solid #9DB8DE; border-radius:4px; padding:12px 14px; margin-bottom:10px;}
  .home-header p{max-width:none; color:var(--ink-muted);}
  .rainbow-rule{height:5px; border:0; background:repeating-linear-gradient(90deg,#1F5FD9 0 8px,#6FB1FF 8px 16px);}
  .marquee-wrap{background:linear-gradient(#0E46AA,#1E62CC); border:1px solid #0A2F7A; border-radius:3px; margin-block:10px 0;}
  .marquee-wrap .marquee-text{color:#FFF27A; text-shadow:0 1px 0 rgba(0,0,60,.6);}
  .rule-note{background:#FFFFE1; border:1px solid #8C7B3B; border-left:4px solid #E6A100; border-radius:6px; box-shadow:1px 1px 3px rgba(0,0,0,.2); margin-block:14px 6px;}
  .rule-note b{color:#B3000C;}

  /* ---- 섹션 제목 바(유리 느낌 파란 막대) ---- */
  .section-title{
    background:var(--bar-grad); color:#fff; font-size:13px; text-transform:none; letter-spacing:0; font-weight:800;
    border:1px solid #1648A8; border-radius:4px 4px 0 0; padding:5px 10px; margin:22px 0 0;
    text-shadow:0 1px 0 rgba(0,0,80,.55);
  }
  .section-title .num{background:#fff; color:var(--xp-blue-2); border:1px solid #fff; border-radius:50%; width:19px; height:19px; font-family:inherit; font-weight:800; text-shadow:none;}
  .section-title + .card, .section-title + .empty-note, .section-title + .history-list{margin-top:0;}
  .section-title + .card{border-top:0; border-radius:0 0 4px 4px;}
  .section-title + .history-list{padding:10px; background:var(--panel-grad); border:1px solid var(--xp-border); border-top:0; border-radius:0 0 4px 4px;}
  .section-title + .empty-note{padding:12px; background:var(--panel-grad); border:1px solid var(--xp-border); border-top:0; border-radius:0 0 4px 4px;}

  /* ---- 카드 / 패널 ---- */
  .card{background:#fff; border:1px solid var(--xp-border); border-radius:4px; box-shadow:0 2px 4px rgba(0,40,120,.16);}
  .config-card{background:linear-gradient(#FFFFFF, #F4F8FE);}
  .config-row{border-top:1px dotted #9DB8DE;}
  .config-label .val{font-family:inherit; color:var(--xp-blue-3);}

  /* ---- 버튼: XP Luna ---- */
  .btn{
    border:1px solid #003C74; border-radius:3px; background:var(--btn-grad); color:#000; font-family:inherit; font-weight:400;
    padding:7px 16px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
  }
  .btn:hover{background:var(--btn-grad); box-shadow:inset 0 0 0 2px #FBC863;}
  .btn:active{border-style:solid; background:linear-gradient(#D9D4C8,#ECEBE5); box-shadow:inset 1px 1px 3px rgba(0,0,0,.3);}
  .btn-primary{background:var(--blue-grad); border-color:#0A3B93; color:#fff; font-weight:700; text-shadow:0 -1px 0 rgba(0,0,80,.55); box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
  .btn-primary:hover{background:linear-gradient(#86C0FF 0%, #4A8FF2 48%, #2F72E0 52%, #3F88EE 100%); box-shadow:inset 0 0 0 2px #FBC863;}
  .btn-primary:active{background:linear-gradient(#1D5FD3,#2F7BEA); box-shadow:inset 1px 1px 4px rgba(0,0,60,.5);}
  .btn-sm{padding:4px 10px;}
  .btn-ghost{background:transparent; border-color:transparent; box-shadow:none;}
  .btn-ghost:hover{background:var(--surface-2); box-shadow:none;}
  .start-bar .btn-primary{border-radius:5px; letter-spacing:.02em;}

  /* ---- 칩(작은 태그) ---- */
  .chip{font-family:inherit; font-weight:700; border:1px solid var(--xp-border); border-radius:3px; background:linear-gradient(#FFFFFF,#E6EFFB); color:#16397A;}
  .chip-accent{background:linear-gradient(#EAF2FF,#C7DBF8); color:var(--xp-blue-3); border-color:#5E86C4;}
  .grading-chip.exact{background:linear-gradient(#EAF2FF,#C7DBF8); color:var(--xp-blue-3); border-color:#5E86C4;}
  .grading-chip.self{background:linear-gradient(#FFF6E3,#FFE2B0); color:var(--warn); border-color:var(--warn-line);}

  /* ---- 범위 선택 칩 / 토글: 눌리지 않은 것은 XP 버튼, 선택된 것은 XP 하이라이트 파랑 ---- */
  .round-chip, .lang-chip, .seg button, .filter-bar button{
    background:var(--btn-grad); border:1px solid #003C74; border-radius:3px; color:#1C2E4F; font-family:inherit;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
  }
  .round-chip:hover, .lang-chip:hover, .seg button:hover, .filter-bar button:hover{box-shadow:inset 0 0 0 2px #FBC863;}
  .round-chip[aria-pressed="true"], .seg button[aria-pressed="true"], .filter-bar button[aria-pressed="true"]{
    background:linear-gradient(#4A86E0,#2457B4); border-color:#102F72; color:#fff; box-shadow:inset 1px 1px 3px rgba(0,0,50,.45); text-shadow:0 1px 0 rgba(0,0,60,.5);
  }
  .lang-chip[aria-pressed="true"]{background:linear-gradient(#2B5EB9,#0F3A86); border-color:#081F52; color:#fff; box-shadow:inset 1px 1px 3px rgba(0,0,50,.5); text-shadow:0 1px 0 rgba(0,0,60,.5);}
  .filter-reset{color:#0B4FC4;}
  /* ---- 연도별 묶음 + 일괄 선택 버튼 (2026-10-09) ---- */
  .filter-tools{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px;}
  .year-group{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:6px 0; border-top:1px dotted var(--xp-border);}
  .year-group:first-of-type{border-top:none;}
  .year-group .round-grid{flex:1 1 auto; min-width:0;}
  .year-chip{min-width:104px; text-align:center; font-weight:800; white-space:nowrap;}
  .round-chip{white-space:nowrap;}
  input[type="range"]{accent-color:#245EDC;}

  /* ---- 기록 목록 ---- */
  .history-row{background:#fff; border:1px solid #B4C7E3; border-radius:3px;}
  .history-row.history-row-clickable:hover{background:var(--accent-soft); border-color:var(--xp-blue-2);}

  /* ---- 풀이 화면: 상단 도구줄 + XP 진행바 + LCD 타이머 ---- */
  .exam-top{background:linear-gradient(#F6F9FE,#D3E2F7); border-bottom:1px solid var(--xp-border); box-shadow:0 2px 3px rgba(0,40,120,.18);}
  .progress-track{height:14px; background:#fff; border:1px solid #686868; border-radius:3px; padding:1px; box-shadow:inset 1px 1px 2px rgba(0,0,0,.22);}
  .progress-fill{border-radius:2px; transition:width .2s;
    background-image:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0) 55%), repeating-linear-gradient(90deg,#2F7BEA 0 7px, rgba(255,255,255,0) 7px 9px);
    background-color:transparent;}
  .timer{background:#00164A; color:#7CF3FF; border:2px inset #6C8FC9; border-radius:3px; text-shadow:0 0 6px #2AC7E0; letter-spacing:1px;}
  .timer.warn{background:#4A2C00; color:#FFC857; text-shadow:0 0 6px #FF9F1A; border-color:#C9A06C;}
  .timer.bad{background:#4A0008; color:#FF8A8A; text-shadow:0 0 6px #FF3B3B; border-color:#C98C8C;}
  .exit-btn{color:#4E6A99;}

  /* ---- 문제 카드: 머리줄을 게시판 제목 바처럼 ---- */
  .q-card .q-head, .review-card .q-head{
    align-items:center; background:var(--bar-grad); border-bottom:1px solid #1648A8; border-radius:3px 3px 0 0;
    padding:7px 14px;
  }
  .q-card .q-head{margin:-20px -20px 16px;}
  .review-card .q-head{margin:-16px -16px 12px;}
  .q-head .q-num{color:#fff; font-family:inherit; font-style:italic; font-weight:800; font-size:16px; text-shadow:1px 1px 0 #0A2F7A;}
  .q-head .src-link{color:#fff; text-shadow:0 1px 0 rgba(0,0,80,.5);}
  .q-head .src-link:visited{color:#fff;}
  .flag-btn{background:var(--btn-grad); border:1px solid #003C74; border-radius:3px; color:#1C2E4F; font-family:inherit; box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);}
  .flag-btn:hover{box-shadow:inset 0 0 0 2px #FBC863;}
  .flag-btn[aria-pressed="true"]{background:linear-gradient(#FFF6E3,#FFE2B0); border-color:var(--warn); color:var(--warn);}

  /* ---- 입력칸: XP 텍스트 상자 ---- */
  .answer-input{border:1px solid var(--xp-border); border-radius:2px; box-shadow:inset 1px 1px 2px rgba(0,0,0,.14);}
  .answer-input:focus, .answer-input:focus-visible{outline:none; border-color:#316AC5; box-shadow:0 0 0 2px rgba(49,106,197,.35), inset 1px 1px 2px rgba(0,0,0,.14);}

  .answer-input.ap-ng{border-color:var(--bad-line); background:var(--bad-soft); color:var(--bad);}

  /* ---- 정답·해설 상자 ---- */
  .model-answer-box{background:#fff; border:1px solid var(--xp-border); border-left:4px solid var(--xp-blue-2); border-radius:3px;}

  /* ---- 문항 이동판: 두껍고 둥근 테두리의 포털 사이드 패널 ---- */
  .navpanel{background:#fff; border:3px solid #BCD3F2; border-radius:9px; padding:10px 12px 12px;}
  .navpanel summary{color:var(--xp-blue-3);}
  .qgrid button{background:var(--btn-grad); border:1px solid #003C74; border-radius:3px; color:#1C2E4F; font-family:inherit; box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);}
  .qgrid button:hover{box-shadow:inset 0 0 0 2px #FBC863;}
  .qgrid button.answered{background:linear-gradient(#EAF2FF,#C7DBF8); border-color:#245EDC; color:var(--xp-blue-3);}
  .qgrid button.current{background:var(--blue-grad); border-color:#0A3B93; color:#fff; text-shadow:0 -1px 0 rgba(0,0,80,.5);}

  .qgrid button.result-wrong{background:linear-gradient(#F57F7F,#DB3B3B 52%,#D32F2F); border-color:#8E1414; color:#fff; text-shadow:0 -1px 0 rgba(90,0,0,.55);}
  .qgrid button.result-pending{background:linear-gradient(#FFD98A,#F5B03A 52%,#F0A92E); border-color:#9A6000; color:#3D2400; text-shadow:none;}

  .qgrid button.current.result-wrong,

    margin:30px -16px -60px; padding:16px 16px 60px; border-top:1px solid #8FA6C7; text-align:center;

  /* ---- 중간 저장 · 이어서 풀기 (2026-10-11) ---- */
  .modal-actions{flex-wrap:wrap;}
  /* ---- 코드 문제 복사 버튼 (2026-10-12) ---- */
  .code-tools{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; margin:12px 0 -8px;}
  .copy-btn{white-space:nowrap;}
  .copy-btn.copied{border-color:#1E8E3E; color:#0B5A22; background:#E5F5E8;}
  .save-list{display:flex; flex-direction:column; gap:6px;}
  .section-title + .save-list{padding:10px; background:var(--panel-grad); border:1px solid var(--xp-border); border-top:0; border-radius:0 0 4px 4px;}
  .save-row{display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; padding:9px 11px; background:#fff; border:1px solid #B4C7E3; border-radius:3px; font-size:12.5px;}

  .sv-actions{display:flex; gap:6px; flex:none;}
  .save-note{font-size:11.5px; color:var(--ink-faint); margin:6px 2px 0;}
  .toast-root{position:fixed; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:140; display:flex; justify-content:center; padding-inline:16px; pointer-events:none;}
  .toast{max-width:460px; padding:10px 16px; font-size:13px; line-height:1.5; color:#fff; background:#12326F; border:1px solid #0A2F7A; border-radius:4px; box-shadow:2px 3px 10px rgba(0,0,40,.45); opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s;}
  .toast.show{opacity:1; transform:none;}
  .toast.bad{background:#8E1414; border-color:#5E0A0A;}
  /* ---- 같은 문제의 언어 판(탭) · 참고 사이트 출처 (2026-10-12) ---- */
  :root{ --dot-red:#E0141E; --dot-red-ring:rgba(120,0,0,.45); }
  .ver-tabs-wrap{margin:-2px 0 14px;}
  .ver-tabs{display:flex; flex-wrap:wrap; gap:4px; border-bottom:2px solid var(--xp-border); padding-inline:2px;}
  .ver-tab{display:inline-flex; align-items:center; gap:7px; padding:6px 16px; margin-bottom:-2px; font-size:13px; font-weight:800; font-family:inherit;
    color:#1C2E4F; background:var(--btn-grad); border:1px solid var(--xp-border); border-bottom:2px solid var(--xp-border); border-radius:5px 5px 0 0;}
  .ver-tab:hover:not(:disabled){box-shadow:inset 0 0 0 2px #FBC863;}
  .ver-tab.on{background:#fff; color:var(--xp-blue-3); border-bottom-color:#fff; box-shadow:none;}
  .ver-tab:disabled{opacity:.5; cursor:not-allowed;}
  .vt-dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--dot-red); box-shadow:0 0 0 1px #fff, 0 0 0 2px var(--dot-red-ring); flex:none;}
  .vt-dot.sm{width:8px; height:8px; vertical-align:middle; margin-inline:2px;}
  .chip .vt-dot.sm{margin-inline:0 0;}
  .ver-note{margin-top:7px; font-size:11.5px; line-height:1.5; color:var(--ink-faint);}
  .ref-box{margin-top:26px; padding:12px 14px; background:var(--panel-grad); border:1px solid #9DB8DE; border-radius:4px;}
  .ref-title{font-weight:800; color:var(--xp-blue-3); margin-bottom:4px;}
  .ref-text{margin:4px 0; font-size:12.5px; color:var(--ink-muted); line-height:1.6;}
  .ref-links{display:flex; flex-wrap:wrap; gap:6px 14px; margin:8px 0; font-size:12.5px;}
  .ref-license{font-size:11.5px; color:var(--ink-faint);}
  @media (max-width:480px){ .ver-tab{padding:6px 12px;} }
  /* ---- 기기 간 동기화 상태 줄 · 학습 모드 메모패드 (2026-10-12) ---- */
  .sync-bar{display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; margin:0 0 12px; padding:7px 11px; font-size:12px; line-height:1.55; color:var(--ink-muted);
    background:var(--panel-grad); border:1px solid #9DB8DE; border-radius:4px;}
  .sync-dot{flex:none; width:9px; height:9px; border-radius:50%; background:#8A94A6; box-shadow:0 0 0 1px #fff, 0 0 0 2px rgba(40,50,70,.35);}
  .sync-bar[data-state="on"] .sync-dot{background:#1E8E3E;}
  .sync-bar[data-state="connecting"] .sync-dot{background:#F0A92E;}
  .sync-bar[data-state="denied"] .sync-dot, .sync-bar[data-state="readonly"] .sync-dot, .sync-bar[data-state="full"] .sync-dot, .sync-bar[data-state="error"] .sync-dot{background:#D32F2F;}
  .sync-text{flex:1 1 260px; min-width:0; overflow-wrap:anywhere;}
  .sync-perm[hidden]{display:none;}
  /* ---- 기록 파일(내보내기 · 가져오기 · 폴더 연결) ---- */
  .file-bar{margin:0 0 12px; padding:8px 11px; font-size:12px; line-height:1.55; color:var(--ink-muted); background:var(--panel-grad); border:1px solid #9DB8DE; border-radius:4px;}
  .fb-head{font-weight:800; color:var(--ink); font-size:12.5px;}
  .fb-text{margin:3px 0 7px; overflow-wrap:anywhere;}
  .fb-actions{display:flex; flex-wrap:wrap; gap:6px;}
  .fb-state{display:flex; align-items:flex-start; gap:8px; margin-top:8px;}
  .fb-state .sync-dot{margin-top:5px;}
  .fb-state-text, .fb-note{min-width:0; overflow-wrap:anywhere;}
  .fb-note{margin-top:8px; color:var(--ink-faint);}
  .file-bar[data-state="on"] .sync-dot{background:#1E8E3E;}
  .file-bar[data-state="needperm"] .sync-dot{background:#F0A92E;}
  .file-bar[data-state="error"] .sync-dot{background:#D32F2F;}
  .imp-list{max-height:min(46vh, 330px); overflow:auto; margin:10px 20px 0; padding:4px 0; border:1px solid var(--xp-border); background:#fff; font-size:12px; line-height:1.5;}
  .imp-row{display:flex; flex-wrap:wrap; gap:2px 8px; padding:4px 10px; border-bottom:1px dotted var(--xp-border);}
  .imp-row:last-child{border-bottom:0;}
  .imp-badge{flex:none; padding:0 6px; font-weight:800; border-radius:8px; color:#fff; background:#2E7D32;}
  .imp-badge.upd{background:#B26A00;}
  .imp-when{flex:none; font-variant-numeric:tabular-nums; color:var(--ink);}
  .imp-label{flex:1 1 200px; min-width:0; overflow-wrap:anywhere; color:var(--ink-muted);}
  .imp-more{padding:4px 10px; color:var(--ink-faint);}
  #btn-memo.on{background:linear-gradient(#FFF6E3,#FFE2B0); border-color:var(--warn); color:var(--warn);}

  /* ---------- 메모패드(서식 편집기) ---------- */
  .memo-panel{position:relative; display:flex; flex-direction:column; flex:1 1 0; min-height:320px; min-width:0; background:#fff; border:3px solid #BCD3F2; border-radius:9px; overflow:hidden;}
  .memo-panel[hidden]{display:none;}
  .memo-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 6px 5px 12px; background:var(--bar-grad); color:#fff; font-weight:800; font-size:12.5px; text-shadow:1px 1px 0 #0A2F7A;}
  .memo-title{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .memo-x{flex:none; background:none; border:none; color:#fff; font-size:18px; line-height:1; padding:2px 8px; cursor:pointer; text-shadow:1px 1px 0 #0A2F7A;}
  .memo-x:hover{background:rgba(255,255,255,.22);}
  /* 서식 도구줄 */
  .memo-tools{display:flex; flex-wrap:wrap; align-items:center; gap:4px 0; padding:5px 6px; background:#EEF4FC; border-bottom:1px solid var(--xp-border);}
  .mt-grp{display:flex; align-items:center; gap:2px; padding:0 6px 0 0; margin:0 6px 0 0; border-right:1px solid #B9CBE6;}
  .mt-grp:last-child{border-right:0; margin-right:0; padding-right:0;}
  .mt-btn{display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:26px; padding:0 5px; border:1px solid transparent; border-radius:3px;
    background:transparent; color:#1C2E4F; font-family:inherit; font-size:13px; line-height:1; cursor:pointer;}
  .mt-btn:hover{border-color:#7F9DB9; background:#fff;}
  .mt-btn[aria-pressed="true"]{border-color:#245EDC; background:#CFE0FA; color:#0B3C9E;}
  .mt-btn:focus-visible, .mt-sel:focus-visible{outline:2px solid #245EDC; outline-offset:1px;}
  .mt-btn b, .mt-btn i, .mt-btn u, .mt-btn s{font-size:14px; font-family:'Times New Roman',serif;}
  .mt-btn svg{display:block;}
  .mt-tx{font-family:'Times New Roman',serif; font-size:14px; font-style:italic;}
  .mt-tx sub{font-size:9px; font-style:normal; vertical-align:baseline; position:relative; top:3px;}
  .mt-color{flex-direction:column; justify-content:center; gap:1px; padding:0 4px;}
  .mt-color-a{font-size:13px; font-weight:800; line-height:13px;}
  .mt-color-bar{display:block; width:16px; height:3px; background:#101820; border:0;}
  .mt-sel{height:26px; max-width:132px; padding:0 2px; border:1px solid var(--xp-border); border-radius:3px; background:#fff; color:#1C2E4F; font-family:inherit; font-size:12px;}
  .mt-sel-size{width:52px;}
  .mt-sel-font{width:108px;}
  /* 글자색 고르기 */
  .memo-colors{position:absolute; z-index:5; padding:8px; background:#fff; border:1px solid #7F9DB9; border-radius:4px; box-shadow:0 4px 12px rgba(0,30,100,.28);}
  .mc-grid{display:grid; grid-template-columns:repeat(5, 24px); gap:5px;}
  .mc-sw{width:24px; height:24px; padding:0; border:1px solid rgba(0,0,0,.35); border-radius:3px; cursor:pointer;}
  .mc-sw:hover{outline:2px solid #245EDC; outline-offset:1px;}
  .mc-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; font-size:11.5px; color:var(--ink-muted);}
  .mc-lab{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .mc-custom{width:30px; height:22px; padding:0; border:1px solid #7F9DB9; background:#fff; cursor:pointer;}
  /* 편집창 */
  .memo-edit-wrap{position:relative; flex:1 1 0; min-height:0; display:flex; background:#FFFEF6; border-bottom:1px solid var(--xp-border);}
  .memo-editor{flex:1 1 auto; min-width:0; overflow:auto; padding:12px 14px; font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif;
    font-size:14px; line-height:1.65; color:var(--ink); background:#FFFEF6; white-space:pre-wrap; overflow-wrap:anywhere; tab-size:4; outline:none; cursor:text;}
  .memo-editor:focus, .memo-editor:focus-visible{outline:none; box-shadow:inset 0 0 0 2px rgba(49,106,197,.35);}
  .memo-editor ul, .memo-editor ol{margin:2px 0; padding-left:1.7em;}
  .memo-editor li{margin:0;}
  .memo-editor hr{height:0; margin:10px 0; border:0; border-top:2px solid #7F9DB9;}
  .memo-ph{position:absolute; left:14px; right:14px; top:12px; color:var(--ink-faint); font-size:13px; line-height:1.65; white-space:pre-line; pointer-events:none;}
  .memo-ph[hidden]{display:none;}
  .memo-foot{display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; padding:6px 10px; font-size:11px; color:var(--ink-faint); background:#F4F8FE;}
  .memo-state{flex:1 1 120px; min-width:0;}
  .memo-when{flex:1 0 100%; min-width:0; overflow-wrap:anywhere; color:var(--ink-muted);}
  .memo-when:empty{display:none;}

  /* 넓은 화면: 메모를 켜면 풀이 화면이 화면 폭을 넓게 쓰고, 오른쪽 칸(위: 문항 이동판 · 아래: 편집기)을 메모가 차지한다 */
  :root{--memo-w:clamp(440px, 34vw, 780px);}
  html.memo-open #app[data-screen="exam"]{max-width:2200px;}
  html.memo-open[data-screen="exam"] .app-header-inner{max-width:2200px;}
  .exam-nav-col.with-memo{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--app-header-h, 46px) + 78px);
    width:min(var(--memo-w), calc(100vw - 640px)); height:max(480px, calc(100vh - var(--app-header-h, 46px) - 110px));      /* 110 = 고정 상단줄(78) + 맨 위에서 이 칸이 놓이는 자리와 고정 위치의 차이(28) + 아래 여백(4) */
    display:flex; flex-direction:column; gap:10px;}
  .exam-nav-col.with-memo .navpanel{position:static; flex:0 1 auto; min-height:44px; max-height:min(34%, 260px); overflow:auto;}
  html.memo-open[data-screen="exam"] .exam-body{min-height:calc(max(480px, 100vh - var(--app-header-h, 46px) - 110px) + 32px);}      /* 문제가 짧아도 고정된 오른쪽 칸이 들어갈 만큼은 바탕이 있어야 위 고정줄 밑으로 밀려 들어가지 않는다 */
  @media (min-width:1181px){
    /* 맨 아래까지 스크롤했을 때도 고정된 오른쪽 칸이 위 고정줄 밑으로 밀려 들어가지 않도록, 칸 아래의 바탕 여백을 줄인다
       (조건: 칸 높이 ≤ 화면 높이 − 상단 − 107px. 칸 높이는 위에서 화면 높이 − 상단 − 110px 로 잡았다) */
    html.memo-open[data-screen="exam"] #app{padding-bottom:12px;}
  }
  .memo-resizer{display:none; position:absolute; left:-14px; top:0; bottom:0; width:10px; cursor:col-resize; z-index:3; border-radius:4px; touch-action:none;}
  .memo-resizer::after{content:""; position:absolute; left:3px; top:50%; width:4px; height:44px; margin-top:-22px; border-radius:2px; background:#9DB6DD;}
  .memo-resizer:hover::after, .memo-resizer:focus-visible::after, html.memo-resizing .memo-resizer::after{background:#245EDC;}
  .memo-resizer:focus-visible{outline:2px solid #245EDC; outline-offset:0;}
  .exam-nav-col.with-memo .memo-resizer{display:block;}

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     상태
     DATA는 { meta, rounds_meta:[{year,round,label,count,source_url}],
              languages_meta:[{id,label,count}], questions:[...] } 형태.
     ISTQB 사이트와 달리 "세트 A/B/C/D" 같은 고정 분류가 없으므로, 연도+회차 / 언어
     두 축을 다중 선택해 문제 풀(pool)을 직접 구성한다(사용자 결정: 이중 필터).
  --------------------------------------------------------- */
  var DATA = null;
  var ALL_Q = [];
  var ALL_Q_BY_ID = {};      // 합쳐져 없어진 옛 문항 id 도 남은 문항을 가리킨다(옛 기록·저장·메모 호환)
  var ALIAS_OF = {};         // 합쳐져 없어진 옛 id → 남은 문항 id
  var ROUNDS_META = [];
  var ROUNDS_META_BY_KEY = {};
  var LANGS_META = [];
  var VARIANT_IDS = [];      // 같은 문제의 다른 언어 판(탭)이 있는 문항 id
  var REF = null;            // 참고한 웹사이트(sssinga) 출처 정보 (data.json meta.ref_source)

  var S = {
    screen: 'home',
    selectedRounds: {},     // {} = 전체. key: "year-round"
    selectedLangs: {},      // {} = 전체. key: language id
    countMax: 0,
    count: 30,
    shuffle: true,
    timeLimit: 0,
    mode: 'exam',            // 'exam' | 'study'
    pool: [],
    idx: 0,
    answers: {},             // qid -> 입력한 텍스트(문자열)
    selfMarks: {},           // qid -> true(맞음)/false(틀림)/undefined(미채점) — 서술형 전용
    revealed: {},            // qid -> true (정답 공개 여부, study 모드 또는 결과화면)
    flagged: {},
    startedAt: null,
    timeLimitSec: 0,
    remainingSec: 0,
    timerHandle: null,
    sourceLabel: '',
    sessionId: null,         // 중간 저장 칸을 구분하는 id (풀이 1회 = id 1개)
    result: null,
    resultFilter: 'all',
    langPref: 'default',     // 언어 판이 2개인 문항을 처음에 어느 쪽으로 보여줄지: 'default'(기존 CBT 판) | 'Java' | 'C'
    verSel: {},              // qid -> 지금 보는 판의 key ('base' | 변형 key) — 언어 판이 있는 문항만
    ansByVer: {}             // qid -> {판 key: 그 판에 쓴 답}. 지금 보는 판의 답은 S.answers 에 있다
  };

  var HIST_KEY = 'jcb_cbt_history_v1';
  var HIT_KEY = 'jcb_cbt_hits_v2';
  var SAVE_KEY = 'jcb_cbt_saves_v1';   // 중간 저장본 목록(최신순)
  var SAVE_MAX = 10;                    // 저장본 최대 개수
  var LANGPREF_KEY = 'jcb_cbt_langpref_v1';   // '언어 우선' 설정(처음 화면)
  var HIT_COUNT = 0;
  var HIST_MAX = 25;                          // 최근 연습 기록 보관 개수
  var MEMO_KEY = 'jcb_cbt_memos_v1';          // 문항별 메모 {문항id: {t:서식 없는 글, ts:고친 시각, c:처음 쓴 시각, h:서식 HTML(서식이 있을 때만)}}
  var MEMOOPEN_KEY = 'jcb_cbt_memoopen_v1';   // 메모패드를 열어 둔 채인지(기기별 화면 설정이라 동기화하지 않는다)
  var SYNC_KEY = 'jcb_cbt_sync_v1';           // 동기화 장부 {uid, merged, pending:{문서id:'set'|'del'}}
  var MEMO_MAX = 20000;                       // 메모 한 개의 최대 글자 수
  var FILETOMB_KEY = 'jcb_cbt_filetomb_v1';   // 폴더 연결 중 '이 기기에서 지운 항목' 기억 {문서id: 지운 시각}(7일)
  var FILE_NAME = 'jcb_cbt_records.json';     // 폴더 연결 시 만드는 기록 파일 이름(영문 — 클라우드 폴더·다른 운영체제에서 이름이 깨지지 않게)
  var REC_FORMAT = 'jcb_cbt_records';         // 기록 파일 형식 표시
  var REC_VERSION = 1;
  var REC_MAX_BYTES = 30 * 1024 * 1024;       // 읽을 파일 크기 상한
  var TOMB_DAYS = 7;

  /* ---------------------------------------------------------
     유틸
  --------------------------------------------------------- */
  function $(sel, ctx){ return (ctx||document).querySelector(sel); }
  function $all(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
  function pad6(n){ n = String(n); while(n.length<6) n = '0'+n; return n; }
  function bumpHitCounter(){
    return safeLS(function(){
      var n = parseInt(localStorage.getItem(HIT_KEY)||'0',10) + 1;
      localStorage.setItem(HIT_KEY, String(n));
      return n;
    }, 1);
  }
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'html') e.innerHTML = attrs[k];
      else if(k === 'text') e.textContent = attrs[k];
      else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k] === null || attrs[k] === false || attrs[k] === undefined){ /* skip */ }
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function shuffleArr(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function fmtTime(sec){
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function fmtDuration(sec){
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec%60;
    if(m<=0) return s+'초';
    return m+'분 '+s+'초';
  }
  function fmtDate(ts){
    var d = new Date(ts);
    var mm = (d.getMonth()+1); var dd = d.getDate();
    var hh = d.getHours(); var mi = d.getMinutes();
    function p(n){return (n<10?'0':'')+n;}
    return mm+'/'+dd+' '+p(hh)+':'+p(mi);
  }
  function safeLS(fn, fallback){
    try{ return fn(); }catch(e){ return fallback; }
  }

  /* ---------------------------------------------------------
     같은 문제의 다른 언어 판 (2026-10-12)
     - 문항(base)은 그대로 두고, data.json 의 variants 에 다른 언어 판이 붙어 있다. 판 key: 'base' | 변형 key.
     - viewOf(base, key) = 기본 문항 위에 그 판의 필드(지문·코드·정답·해설…)를 덮어쓴 '보기용 사본'(캐시).
       사본은 id 가 기본 문항과 같다 → 답안·검토표시·저장·기록은 모두 같은 id 로 다룬다.
     - S.pool 에는 기본 문항이 들어 있고, 화면에 그리거나 채점할 때만 effQ(q) 로 지금 보는 판을 꺼낸다.
     - 답안은 판마다 따로 보관한다(S.ansByVer). 지금 보는 판의 답만 S.answers[id] 에 두므로 진행 표시·저장은 그대로 동작한다.
     - 빨간 점 = 참고 사이트(sssinga)에 실린 버전(base.blog_version 이 그 판의 key).
  --------------------------------------------------------- */
  var LANG_ORDER = ['Java', 'C'];
  var VIEW_CACHE = {};
  function hasVariants(q){ return !!(q && q.variants && q.variants.length); }
  function baseOf(q){ return q && q._base ? q._base : q; }

  /* ---------------------------------------------------------
     여러 회차에 다시 나온 같은 문제 (2026-10-12)
     - 같은 문제는 한 번만 싣고, 출제된 연도·회차·번호를 appearances 에 모두 적어 둔다(오래된 순).
       한 번만 나온 문항은 자기 자신 하나짜리 목록을 갖는다(data.json 에는 appearances 가 없고, 불러올 때 채운다).
     - id/year/round/display_number 는 '남긴 판'의 것이다. 회차 필터·순서·표시는 appearances 를 쓴다.
     - 합쳐져 없어진 옛 id 는 aliases 에 있다. ALL_Q_BY_ID 에 같이 등록해 옛 기록·저장·메모가 남은 문항으로 이어진다.
  --------------------------------------------------------- */
  function appsOf(q){
    var b = baseOf(q);
    return b._apps || [{id:b.id, year:b.year, round:b.round, number:b.display_number}];
  }
  function appKey(a){ return a.year + '-' + a.round; }
  function appText(a){ return a.year + '년 ' + a.round + '회 #' + a.number; }
  function appsText(q, sep){ return appsOf(q).map(appText).join(sep || ' · '); }
  function appsShort(q){ var as = appsOf(q); return appText(as[0]) + (as.length > 1 ? ' 외 ' + (as.length - 1) + '회' : ''); }
  function appCmp(a, b){ return (a.year - b.year) || (a.round - b.round) || (parseInt(a.number, 10) - parseInt(b.number, 10)); }
  /* 지금 고른 회차 범위 안에서 가장 이른 출제 기록(범위를 고르지 않았으면 전체에서 가장 이른 기록) — 풀이 순서·안내 문구의 기준 */
  function leadApp(q){
    var as = appsOf(q);
    if(Object.keys(S.selectedRounds).length){
      for(var i = 0; i < as.length; i++){ if(S.selectedRounds[appKey(as[i])]) return as[i]; }
    }
    return as[0];
  }
  /* 문제 번호 옆의 '출제 연도·회차' 칩. 여러 회차에 나온 문제는 오래된 순으로 모두 보여준다. */
  function appChips(q){
    var as = appsOf(q);
    return as.map(function(a){
      return el('span', {class:'chip app-chip', title: as.length > 1 ? ('같은 문제가 ' + as.length + '개 회차에 출제되었습니다: ' + appsText(q, ', ')) : null,
        text: a.year + '년 ' + a.round + '회 · #' + a.number});
    });
  }
  /* 비슷하지만 정답이 달라 '합치지 않은' 문제 — 번호 옆에 상대 문제가 출제된 연도·회차만 점선 칩으로 보여 준다(2026-10-12).
     같은 문제가 아니므로 출제 기록(appearances)·회차 필터·집계에는 넣지 않는다. */
  function similarOf(q){ var b = baseOf(q); return b.similar || []; }
  function simChips(q){
    return similarOf(q).map(function(s){
      return el('span', {class:'chip sim-chip',
        title: '비슷하지만 정답이 다른 문제가 ' + s.year + '년 ' + s.round + '회 #' + s.number + '에도 출제되었습니다(같은 문제가 아니라 합치지 않았습니다)' + (s.note ? ' — ' + s.note : ''),
        text: '유사 ' + s.year + '년 ' + s.round + '회'});
    });
  }
  function versionList(base){            // 탭 순서: Java → C → 그 밖. 같은 언어면 기본 판이 앞.
    if(base._versions) return base._versions;
    var list = [{key:'base', language:base.language, blog: base.blog_version === 'base'}];
    base.variants.forEach(function(v){ list.push({key:v.key, language:v.language, blog: base.blog_version === v.key}); });
    function rank(l){ var i = LANG_ORDER.indexOf(l); return i < 0 ? LANG_ORDER.length : i; }
    list = list.map(function(v, i){ return {v:v, i:i}; }).sort(function(a, b){
      return (rank(a.v.language) - rank(b.v.language)) || (a.i - b.i);
    }).map(function(x){ return x.v; });
    base._versions = list;
    return list;
  }
  function viewOf(q, key){
    var base = baseOf(q);
    if(!hasVariants(base) || !key || key === 'base') return base;
    var ck = base.id + '|' + key;
    if(VIEW_CACHE[ck]) return VIEW_CACHE[ck];
    var v = null;
    base.variants.forEach(function(x){ if(x.key === key) v = x; });
    if(!v) return base;
    var view = Object.assign({}, base);
    ['answer_parts', 'answer_alts', 'explanation_lines', 'code_table', 'restored', 'variants', '_versions', 'blog_url'].forEach(function(f){ delete view[f]; });
    ['language', 'lang_hint', 'source_url', 'prompt', 'prompt_blocks', 'code', 'grading', 'answer', 'explanation'].forEach(function(f){ view[f] = v[f]; });
    if(v.answer_parts) view.answer_parts = v.answer_parts;
    if(v.answer_alts) view.answer_alts = v.answer_alts;
    if(v.blog_url) view.blog_url = v.blog_url;
    view._base = base; view._verKey = key; view._blog = (base.blog_version === key);
    VIEW_CACHE[ck] = view;
    return view;
  }
  /* '언어 우선' 설정에 따라 처음 보여줄 판 */
  function defaultKeyFor(base){
    if(!hasVariants(base) || S.langPref === 'default') return 'base';
    var hit = versionList(base).filter(function(v){ return v.language === S.langPref; })[0];
    return hit ? hit.key : 'base';
  }
  function curKey(base){ return S.verSel[base.id] || 'base'; }
  /* 지금 보는 판 (언어 판이 없는 문항은 자기 자신) */
  function effQ(q){
    var b = baseOf(q);
    return hasVariants(b) ? viewOf(b, curKey(b)) : b;
  }
  /* 필터·집계용: 풀이를 시작하면 처음에 보일 판의 언어 */
  function effLangOf(q){
    var b = baseOf(q);
    return hasVariants(b) ? viewOf(b, defaultKeyFor(b)).language : b.language;
  }
  /* 풀이 시작·다시 풀기 때 문항마다 처음 판을 확정한다(풀이 도중 설정이 바뀌어도 흔들리지 않게). */
  function freezeVersions(pool){
    S.verSel = {};
    S.ansByVer = {};
    pool.forEach(function(q){ if(hasVariants(q)) S.verSel[q.id] = defaultKeyFor(q); });
  }
  function blogDot(small){
    return el('span', {class:'vt-dot' + (small ? ' sm' : ''), role:'img',
      'aria-label':'참고 사이트(sssinga) 출처 버전', title:'참고 사이트(sssinga.tistory.com)에 실린 버전'});
  }
  function switchVersion(base, key){
    var id = base.id, cur = curKey(base);
    if(cur === key) return;
    if(S.mode === 'study' && S.revealed[id]) return;             // 정답을 본 뒤에는 판을 바꿀 수 없다
    var st = (S.ansByVer[id] = S.ansByVer[id] || {});
    st[cur] = S.answers[id] || '';                                // 떠나는 판의 답을 보관
    var next = st[key] || '';                                     // 가는 판에 전에 쓴 답이 있으면 되살린다
    if(next.trim()) S.answers[id] = next; else delete S.answers[id];
    S.verSel[id] = key;
    renderQuestion(); renderNavGrid();
  }
  /* 문제 머리 아래에 두는 언어 탭 줄 */
  function buildVerTabs(base, cur){
    var locked = S.mode === 'study' && !!S.revealed[base.id];
    var wrap = el('div', {class:'ver-tabs-wrap'});
    var list = el('div', {class:'ver-tabs', role:'tablist', 'aria-label':'같은 문제의 언어 버전 선택'});
    var vers = versionList(base);
    var btns = [];
    vers.forEach(function(v){
      var on = v.key === cur._verKey;
      var b = el('button', {type:'button', role:'tab', class:'ver-tab' + (on ? ' on' : ''), 'aria-selected':String(on),
        tabindex: on ? '0' : '-1', disabled: (locked && !on) ? '' : null,
        title: v.language + (v.blog ? ' — 참고 사이트(sssinga)에 실린 버전' : ' — 기존 CBT 버전'),
        onclick:function(){ switchVersion(base, v.key); }}, [el('span', {class:'vt-lang', text:v.language})]);
      if(v.blog) b.appendChild(blogDot(false));
      btns.push({v:v, b:b});
      list.appendChild(b);
    });
    list.addEventListener('keydown', function(ev){
      if(ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
      ev.stopPropagation();                                       // 문항 이동 단축키로 새지 않게
      if(locked) return;
      var at = 0;
      vers.forEach(function(v, i){ if(v.key === cur._verKey) at = i; });
      var to = (at + (ev.key === 'ArrowRight' ? 1 : vers.length - 1)) % vers.length;
      ev.preventDefault();
      switchVersion(base, vers[to].key);
    });
    wrap.appendChild(list);

  function loadHistory(){
    return safeLS(function(){

  function saveHistoryEntry(entry){

    writeHistory(h);
    syncSet('hist', String(entry.ts), entry);                       // 다른 기기와 공유(동기화가 켜져 있을 때)

  /* ---------------------------------------------------------
     중간 저장 · 이어서 풀기 (2026-10-11)
     - 저장 위치: 이 브라우저의 localStorage(SAVE_KEY). 다른 기기·브라우저와 공유되지 않는다.
     - 문항 본문은 저장하지 않고 문항 id 목록만 저장한다. 불러올 때 data.json 에서 다시 찾아 채운다.
     - 같은 풀이(S.sessionId)를 다시 저장하면 같은 칸을 덮어쓰고, 제출하면 그 칸은 자동으로 지워진다.
  --------------------------------------------------------- */
  function loadSaves(){
    return safeLS(function(){
      var raw = localStorage.getItem(SAVE_KEY);
      var a = raw ? JSON.parse(raw) : [];
      return Array.isArray(a) ? a : [];
    }, []);
  }
  function writeSaves(list){
    return safeLS(function(){
      var str = JSON.stringify(list);
      localStorage.setItem(SAVE_KEY, str);
      return localStorage.getItem(SAVE_KEY) === str;   // 쓰기가 조용히 막힌 경우까지 잡는다
    }, false);
  }
  function newSessionId(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function countAnswered(){
    return Object.keys(S.answers).filter(function(k){ return S.answers[k] && S.answers[k].trim().length>0; }).length;
  }
  function snapshotSession(){
    if(!S.sessionId) S.sessionId = newSessionId();
    var elapsed = S.timeLimitSec>0 ? (S.timeLimitSec - Math.max(0,S.remainingSec)) : Math.round((Date.now()-S.startedAt)/1000);
    return {
      id: S.sessionId, ts: Date.now(), sourceLabel: S.sourceLabel, mode: S.mode,
      ids: S.pool.map(function(q){ return q.id; }), idx: S.idx,
      answers: S.answers, selfMarks: S.selfMarks, revealed: S.revealed, flagged: S.flagged,
      vers: S.verSel, ansByVer: S.ansByVer,
      timeLimitSec: S.timeLimitSec, remainingSec: Math.max(0,S.remainingSec), elapsedSec: elapsed,

  }
  /* 반환: 'ok' | 'full'(최대 개수 초과) | 'fail'(브라우저가 저장을 막음) */
  function putSave(snap){
    var list = loadSaves();
    var pos = -1;
    list.forEach(function(x,i){ if(x && x.id===snap.id) pos = i; });
    if(pos>=0) list.splice(pos,1);
    else if(list.length>=SAVE_MAX) return 'full';
    list.unshift(snap);
    var ok = writeSaves(list);
    if(ok) syncSet('save', snap.id, snap);
    return ok ? 'ok' : 'fail';
  }
  function removeSave(id){
    if(!id) return;
    var list = loadSaves();
    var next = list.filter(function(x){ return x && x.id!==id; });
    var had = next.length !== list.length;
    if(had) writeSaves(next);
    if(had || (SYNC.remote && SYNC.remote['save_' + id])) syncDel('save', id);
  }
  /* 저장 시도 → 결과별 안내. 저장에 성공했을 때만 afterOk 를 실행한다(실패하면 풀이 화면에 그대로 남는다). */
  function trySave(afterOk){
    var r = putSave(snapshotSession());
    if(r==='ok'){
      showToast('저장했습니다 (' + loadSaves().length + '/' + SAVE_MAX + ') · 처음 화면의 \'이어서 풀기\'에서 불러올 수 있습니다.' + (SYNC.state === 'on' ? ' 같은 계정의 다른 기기에도 올라갑니다.' : ''));
      if(afterOk) afterOk();
    } else if(r==='full'){
      var oldest = null;
      var all = loadSaves().filter(function(x){ return x && x.id; }).sort(function(a, b){ return (a.ts||0) - (b.ts||0); });   // 오래된 순
      oldest = all[0] || null;
      if(!oldest){ showToast('저장하지 못했습니다.', 'bad'); return; }
      var dropN = Math.max(1, all.length - SAVE_MAX + 1);       // 다른 기기에서 저장한 것이 합쳐져 10개를 넘은 경우에도 한 칸이 비도록
      openModal({
        title:'저장 공간이 가득 찼습니다',
        body:'저장본은 최대 ' + SAVE_MAX + '개까지 둘 수 있습니다. 가장 오래된 저장본(' + fmtDate(oldest.ts) + ' · ' + oldest.sourceLabel + ')' + (dropN > 1 ? ' 등 ' + dropN + '개' : '') + '을 지우고 저장할까요?',
        cancelText:'취소',
        confirmText:'지우고 저장',
        onConfirm:function(){
          all.slice(0, dropN).forEach(function(x){ removeSave(x.id); });
          if(loadSaves().length >= SAVE_MAX){ showToast('저장하지 못했습니다. 이 브라우저가 저장 공간을 막은 것 같습니다.', 'bad'); return; }
          trySave(afterOk);
        }
      });
    } else {
      showToast('저장하지 못했습니다. 이 브라우저가 저장 공간(localStorage)을 막았거나 가득 찬 것 같습니다.', 'bad');
    }
  }
  function modeLabel(m){ return m==='study' ? '학습' : '실전'; }

  /* 합쳐져 없어진 옛 문항 id 로 적힌 저장본을 남은 id 로 바꾼다: 목록은 겹치지 않게 줄이고, 답안·표시는 남은 id 칸으로 옮긴다
     (남은 id 칸에 이미 값이 있으면 그 값을 쓰고, 비어 있으면 옛 id 칸의 값을 쓴다). 저장소의 원본은 건드리지 않는다. */
  function canonSave(rec){
    var ids = [], seen = {}, cur = (rec.ids || [])[rec.idx | 0], curC = cur ? (ALIAS_OF[cur] || cur) : null;
    (rec.ids || []).forEach(function(id){
      var c = ALIAS_OF[id] || id;
      if(!seen[c]){ seen[c] = true; ids.push(c); }
    });
    function empty(v){ return v === undefined || v === null || v === ''; }
    function mapKeys(obj){
      var o = {}, src = obj || {};
      Object.keys(src).forEach(function(k){ if(!ALIAS_OF[k]) o[k] = src[k]; });                       // 남은 id 의 값이 먼저
      Object.keys(src).forEach(function(k){ var c = ALIAS_OF[k]; if(c && empty(o[c]) && !empty(src[k])) o[c] = src[k]; });
      return o;
    }
    var out = {};
    Object.keys(rec).forEach(function(k){ out[k] = rec[k]; });
    out.ids = ids;
    var at = curC ? ids.indexOf(curC) : -1;
    out.idx = at >= 0 ? at : Math.max(0, Math.min(rec.idx | 0, ids.length - 1));
    ['answers', 'selfMarks', 'revealed', 'flagged', 'vers', 'ansByVer'].forEach(function(f){ if(rec[f]) out[f] = mapKeys(rec[f]); });
    return out;
  }

  /* 저장본 → 풀이 화면 복원. 지금 데이터에 없는 문항 id 는 건너뛴다. */
  function resumeSave(rec){
    rec = canonSave(rec);
    var pool = (rec.ids||[]).map(function(id){ return ALL_Q_BY_ID[id]; }).filter(function(q){ return q; });
    if(pool.length===0){ showToast('이 저장본의 문항을 찾을 수 없어 불러오지 못했습니다.', 'bad'); return; }
    var keep = {};
    pool.forEach(function(q){ keep[q.id] = true; });
    function pick(obj){
      var o = {};
      Object.keys(obj||{}).forEach(function(k){ if(keep[k]) o[k] = obj[k]; });
      return o;
    }
    var curId = (rec.ids||[])[rec.idx|0];
    var at = -1;
    pool.forEach(function(q,i){ if(q.id===curId) at = i; });
    if(at<0) at = Math.min(Math.max(0, rec.idx|0), pool.length-1);

    if(S.timerHandle){ clearInterval(S.timerHandle); S.timerHandle = null; }
    if(S._cfgMode === undefined) S._cfgMode = S.mode;     // 처음 화면의 '풀이 모드' 설정은 goHome 에서 되돌린다
    S.mode = rec.mode==='study' ? 'study' : 'exam';
    S.pool = pool;
    S.idx = at;
    S.answers = pick(rec.answers);
    S.selfMarks = pick(rec.selfMarks);
    S.revealed = pick(rec.revealed);
    S.flagged = pick(rec.flagged);
    S.verSel = {};                         // 언어 판: 저장본에 적힌 판을 되살린다(없거나 이상하면 기본 판)
    pool.forEach(function(q){
      if(!hasVariants(q)) return;
      var k = rec.vers && rec.vers[q.id];
      S.verSel[q.id] = (k && versionList(q).some(function(v){ return v.key === k; })) ? k : 'base';
    });
    S.ansByVer = pick(rec.ansByVer);
    S.timeLimitSec = Math.max(0, rec.timeLimitSec|0);
    S.remainingSec = S.timeLimitSec>0 ? Math.max(0, Math.round(+rec.remainingSec||0)) : 0;
    S.startedAt = Date.now() - Math.max(0, +rec.elapsedSec||0)*1000;
    S.sourceLabel = rec.sourceLabel || '이어서 풀기';
    S.sessionId = rec.id;
    S.result = null;
    if(S.timeLimitSec>0) S.timerHandle = setInterval(tickTimer, 1000);

    renderExam();
    showScreen('exam');
    showToast('불러왔습니다 · ' + (at+1) + '번 문항부터 이어서 풉니다.');
  }

  /* ---------------------------------------------------------
     기기 간 동기화 (2026-10-12)
     - 목적: 같은 계정으로 연 다른 기기에서도 '연습 기록 · 중간 저장 · 문항별 메모'가 보이게 한다.
     - 방법: 이 Artifact 가 받은 개인 저장소(db 기능)의 data/users/<내 id>/ 아래에 문서로 올린다.
         hist_<시각>   연습 기록 1건          save_<저장칸 id>   중간 저장 1칸          memo_<문항 id>   문항 메모 1개
       이 경로는 본인만 읽고 쓴다(Artifact 소유자·Claude 도 못 읽는다).
     - 원칙: ① 화면은 언제나 이 브라우저의 localStorage 를 먼저 읽고 먼저 쓴다(기존 키 그대로). 동기화는 그 위에 얹는다.

             ③ 같은 항목이 양쪽에 있으면 ts(고친 시각)가 더 늦은 쪽이 이긴다. 한 기기에서 지우면 다른 기기에서도 지워진다.

             ⑥ 올리지 못한 변경은 장부(SYNC_KEY.pending)에 남겨 두었다가 다음 기회에 다시 올린다.
  --------------------------------------------------------- */
  var SYNC_MAX_PAR = 4;       // 동시에 서버에 쓰는 문서 수의 상한(처음 합칠 때 수십 건을 한꺼번에 쓰지 않도록)
  var SYNC = {
    state: 'off',          // 'off' | 'connecting' | 'on' | 'denied' | 'readonly' | 'full' | 'error'
    why: '',               // 꺼진·오류 사유(화면에 보이는 한국어 문장)
    db: null, col: null, uid: null,
    remote: null,          // 마지막 서버 확정본: {문서id: 내용}
    meta: null,            // 장부(localStorage 에도 저장)
    mem: {},               // 올리는 중인 항목의 메모리 사본(저장소가 막힌 브라우저 대비)
    ver: {},               // 문서별 변경 횟수(쓰는 동안 내용이 또 바뀌었는지 알아차리는 용)
    running: {},           // 문서별 쓰기 진행 여부(한 문서에는 한 번에 한 번만 쓴다)

  function jclone(o){ return JSON.parse(JSON.stringify(o)); }
  function loadSyncMeta(){
    var m = safeLS(function(){ return JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); }, undefined);
    if(m === undefined) return null;                      // 저장소를 못 읽음: 부른 쪽이 메모리 사본을 그대로 쓴다

  }
  function saveSyncMeta(){

  }

  /* ---- 메모 저장(localStorage) ---- */
  var MEMO_MEM = {};
  function loadMemos(){
    var m = safeLS(function(){
      var raw = localStorage.getItem(MEMO_KEY);

      return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};

  }
  function writeMemos(m){
    MEMO_MEM = m;
    return safeLS(function(){
      var str = JSON.stringify(m);
      localStorage.setItem(MEMO_KEY, str);
      return localStorage.getItem(MEMO_KEY) === str;
    }, false);
  }

  /* ---- 종류별 어댑터: 로컬 저장소 ↔ 서버 문서 ---- */
  var KIND = {
    hist: {
      all: function(){ var m = {}; loadHistory().forEach(function(e){ if(e && e.ts) m[String(e.ts)] = e; }); return m; },
      get: function(id){ return KIND.hist.all()[id] || null; },
      put: function(id, it){
        var h = loadHistory().filter(function(e){ return e && String(e.ts) !== id; });
        h.push(it); h.sort(function(a, b){ return (+b.ts||0) - (+a.ts||0); });
        return writeHistory(h);
      },
      del: function(id){ return writeHistory(loadHistory().filter(function(e){ return e && String(e.ts) !== id; })); },
      ts: function(it){ return +it.ts || 0; },
      toDoc: function(id, it){ return jclone(it); },
      fromDoc: function(id, d){ return (d && +d.ts && String(+d.ts) === id) ? jclone(d) : null; }
    },
    save: {
      all: function(){ var m = {}; loadSaves().forEach(function(x){ if(x && x.id && x.ids) m[x.id] = x; }); return m; },
      get: function(id){ return KIND.save.all()[id] || null; },
      put: function(id, it){
        var list = loadSaves().filter(function(x){ return x && x.id !== id; });
        list.push(it); list.sort(function(a, b){ return (+b.ts||0) - (+a.ts||0); });
        return writeSaves(list);
      },
      del: function(id){ return writeSaves(loadSaves().filter(function(x){ return x && x.id !== id; })); },
      ts: function(it){ return +it.ts || 0; },
      toDoc: function(id, it){ return jclone(it); },
      fromDoc: function(id, d){ return (d && d.id === id && Array.isArray(d.ids)) ? jclone(d) : null; }
    },
    memo: {
      all: function(){ return loadMemos(); },
      get: function(id){ return loadMemos()[id] || null; },
      put: function(id, it){
        var m = loadMemos(), o = {t: it.t, ts: it.ts};
        if(it.c) o.c = it.c;
        if(typeof it.h === 'string' && it.h) o.h = it.h;
        m[id] = o; return writeMemos(m);
      },
      del: function(id){ var m = loadMemos(); delete m[id]; return writeMemos(m); },
      ts: function(it){ return +it.ts || 0; },
      toDoc: function(id, it){ var d = {qid: id, t: it.t, ts: it.ts}; if(it.c) d.c = it.c; if(typeof it.h === 'string' && it.h) d.h = it.h; return d; },
      fromDoc: function(id, d){
        if(!(d && typeof d.t === 'string')) return null;
        var o = {t: d.t, ts: +d.ts || 0};
        if(+d.c > 0) o.c = +d.c;
        var h = memoCleanH(d.h);                    // 서버·다른 기기에서 온 서식은 믿지 않고 정화기를 거친다
        if(h) o.h = h;
        return o;
      }
    }
  };
  function parseDocId(d){ var i = d.indexOf('_'); return i < 0 ? null : {kind: d.slice(0, i), id: d.slice(i + 1)}; }

  /* ---- 올리기: 변경은 장부에 적고, 문서마다 한 번에 하나씩 쓴다 ---- */
  function syncSet(kind, id, item, quiet){ if(item) SYNC.mem[kind + '_' + id] = item; fileNote(kind, id, 'set', quiet); queueDoc(kind + '_' + id, 'set'); }
  function syncDel(kind, id, quiet){ delete SYNC.mem[kind + '_' + id]; fileNote(kind, id, 'del', quiet); queueDoc(kind + '_' + id, 'del'); }
  function queueDoc(docId, op){
    // 이 기기가 한 번도 합쳐진 적이 없고 지금 연결도 안 됐다면 장부에 적을 필요가 없다(처음 합칠 때 통째로 올라간다).
    if(!syncMetaFresh().merged && !SYNC.db) return;
    SYNC.meta.pending[docId] = op;
    SYNC.ver[docId] = (SYNC.ver[docId] || 0) + 1;
    saveSyncMeta();
    updateSyncUI();
    flushDoc(docId);
  }
  function flushAll(){ Object.keys(pendingMap()).forEach(flushDoc); }
  function scheduleRetry(){
    if(SYNC.timer) return;
    SYNC.timer = setTimeout(function(){ SYNC.timer = null; flushAll(); }, SYNC.delay);
    SYNC.delay = Math.min(SYNC.delay * 2, 60000);
  }
  function flushDoc(docId){
    if(!SYNC.col || SYNC.blocked || SYNC.running[docId] || SYNC.active >= SYNC_MAX_PAR) return;
    var op = pendingMap()[docId];
    if(!op) return;
    var p = parseDocId(docId), K = p && KIND[p.kind];
    var v = SYNC.ver[docId] || 0;
    var job;
    try{
      var ref = SYNC.col.doc(docId);
      if(!K){ job = Promise.resolve(); }
      else if(op === 'del'){ job = ref.delete(); }
      else {
        var it = K.get(p.id) || SYNC.mem[docId];
        if(!it){ job = Promise.resolve(); }                      // 올릴 내용이 이미 없어졌다
        else {
          var doc = K.toDoc(p.id, it);
          if(new TextEncoder().encode(JSON.stringify(doc)).length > 240000){ SYNC.skipped++; job = Promise.resolve(); }   // 문서 한 개는 256KiB 까지
          else job = ref.set(doc);
        }
      }
    }catch(e){
      job = Promise.reject({code: 'invalid_argument', message: String(e && e.message || e)});
    }
    SYNC.running[docId] = true;
    SYNC.active++;
    job.then(function(){
      SYNC.running[docId] = false; SYNC.active--;
      SYNC.okWrites++; SYNC.lastOk = Date.now(); SYNC.delay = 4000;
      if((SYNC.ver[docId] || 0) === v){
        var pm = syncMetaFresh();
        if(pm.pending[docId] === op) delete pm.pending[docId];
        delete SYNC.mem[docId]; saveSyncMeta();
      }
      else flushDoc(docId);                                      // 쓰는 동안 내용이 또 바뀌었으면 한 번 더
      updateSyncUI();
      flushAll();                                                // 동시에 쓰는 수를 제한하므로, 한 건이 끝나면 다음 건을 시작한다
    }, function(e){
      SYNC.running[docId] = false; SYNC.active--;
      var code = e && e.code;
      if(code === 'invalid_argument'){
        if(SYNC.okWrites === 0){ SYNC.blocked = true; setSync('readonly', ''); }       // 처음부터 쓰기가 막힘 = 쓰기 권한이 없는 계정
        else { SYNC.skipped++; delete syncMetaFresh().pending[docId]; saveSyncMeta(); }      // 이 문서만 안 되는 경우는 건너뛴다
      } else if(code === 'quota_exceeded'){
        SYNC.blocked = true; setSync('full', '');
      } else if(code === 'not_granted' || code === 'revoked'){
        SYNC.blocked = true; setSync('denied', '');

      }
