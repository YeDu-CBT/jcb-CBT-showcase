  /* ---- 받기: 서버 확정본을 이 기기와 합친다 ---- */
  function onRemote(snap){
    if(snap && snap.metadata && snap.metadata.fromCache) return;      // 덜 온 목록으로는 합치지 않는다
    var R = {};
    snap.docs.forEach(function(d){
      if(!/^(hist|save|memo)_/.test(d.id) || !d.exists) return;
      var data = d.data();
      if(data) R[d.id] = data;
    });
    SYNC.remote = R;
    clearTimeout(SYNC.slowT);
    var changed = reconcile();
    var wasOn = SYNC.state === 'on';
    SYNC.lastOk = Date.now();
    if(SYNC.state === 'connecting' || SYNC.state === 'off' || SYNC.state === 'error') setSync('on', '');
    if(changed || !wasOn) refreshViews();
    flushAll();
    updateSyncUI();
  }
  function onRemoteError(e){
    var code = e && e.code;
    SYNC.col = null; SYNC.db = null;                                  // 구독이 끝났으므로 이번 방문에는 더 이어가지 않는다
    if(code === 'not_granted' || code === 'revoked' || code === 'capability_disabled' || code === 'capability_removed') setSync('denied', '');
    else if(code === 'invalid_argument') setSync('readonly', '');
    else setSync('error', (e && e.message) ? String(e.message) : String(code || '알 수 없는 오류'));
  }
  /* 반환: 이 기기의 화면에 보이는 내용이 바뀌었는가 */
  function reconcile(){
    var R = SYNC.remote;
    if(!R) return false;
    var changed = false, first = !syncMetaFresh().merged;
    function isPending(d){ return !!pendingMap()[d]; }
    ['hist', 'save', 'memo'].forEach(function(kind){
      var K = KIND[kind], L = K.all(), rem = {};
      Object.keys(R).forEach(function(d){ var p = parseDocId(d); if(p && p.kind === kind) rem[p.id] = R[d]; });
      Object.keys(rem).forEach(function(id){
        var d = kind + '_' + id;
        if(isPending(d)) return;                                      // 이 기기에서 올리는 중인 것은 건드리지 않는다
        var ritem = K.fromDoc(id, rem[id]);
        if(!ritem) return;
        var l = L[id];
        if(!l || K.ts(ritem) > K.ts(l)){ K.put(id, ritem); changed = true; }
        else if(K.ts(l) > K.ts(ritem)){ queueDoc(d, 'set'); }         // 이 기기 쪽이 더 새롭다
      });
      Object.keys(L).forEach(function(id){
        var d = kind + '_' + id;
        if(rem[id] || isPending(d)) return;
        if(first) queueDoc(d, 'set');                                 // 처음 합칠 때: 이 기기에만 있던 것은 올린다
        else { K.del(id); changed = true; }                           // 다른 기기에서 지운 것: 여기서도 지운다
      });
    });
    if(first){ syncMetaFresh().merged = true; saveSyncMeta(); }
    var hm = KIND.hist.all();                                         // 기록은 최근 HIST_MAX 건만 둔다
    Object.keys(hm).sort(function(a, b){ return (+b) - (+a); }).slice(HIST_MAX).forEach(function(id){
      KIND.hist.del(id); queueDoc('hist_' + id, 'del'); changed = true;
    });
    if(migrateMemoAliases() > 0) changed = true;                      // 다른 기기·파일에서 합쳐지기 전 id 의 메모가 들어왔으면 옮긴다
    return changed;
  }

    Promise.all([c.use('db'), c.use('user')]).then(function(r){
      var db = r[0], user = r[1];
      if(!db || !user){ setSync('off', '로그인된 상태가 아니거나 이 화면에서 개인 저장소를 쓸 수 없어 이 브라우저에만 저장됩니다. claude.ai 에 로그인한 뒤 같은 Artifact 링크로 여세요.'); return; }
      return user.id().then(function(uid){
        if(!uid){ setSync('off', '계정을 알아낼 수 없어 이 브라우저에만 저장됩니다. claude.ai 에 로그인한 뒤 같은 Artifact 링크로 여세요.'); return; }

  }
  function startSync(db, uid){

    SYNC.meta.uid = uid;

  /* 선택이 바뀔 때마다 도구줄 표시를 지금 커서 자리의 서식에 맞춘다 */
  function meSyncTools(){
    if(!ME || !ME.ed || !ME.ed.isConnected || !meSelInEd()) return;
    try{
      [['bold', 'bold'], ['italic', 'italic'], ['underline', 'underline'], ['strike', 'strikeThrough'], ['ul', 'insertUnorderedList'], ['ol', 'insertOrderedList']].forEach(function(p){
        var b = ME.tools[p[0]], on = false;

      if(ME.tools.font) ME.tools.font.value = fk;
      var px = Math.round(parseFloat(cs.fontSize)) || ME_DEF_SIZE, best = ME_SIZES[0];
      ME_SIZES.forEach(function(n){ if(Math.abs(n - px) < Math.abs(best - px)) best = n; });
      if(ME.tools.size) ME.tools.size.value = String(best);
      var cb = ME.tools.color && ME.tools.color.querySelector('.mt-color-bar');

      if(blk && blk !== ME.ed){

        var ratio = parseFloat(bs.lineHeight) / (parseFloat(bs.fontSize) || ME_DEF_SIZE), bl = ME_DEF_LH;
        if(isFinite(ratio)) ME_LHS.forEach(function(v){ if(Math.abs(+v - ratio) < Math.abs(+bl - ratio)) bl = v; });
        if(ME.tools.lh) ME.tools.lh.value = bl;

  /* ===== 6) 배치: 오른쪽 칸(위 이동판 · 아래 편집기) · 너비 끌기 ===== */
  function memoWidthLimits(){

  }

  function setMemoWidth(w, persist){

    if(persist) safeLS(function(){ localStorage.setItem(MEMOW_KEY, String(w)); return true; }, false);
    return w;
  }
  function resetMemoWidth(){
    document.documentElement.style.removeProperty('--memo-w');

  function buildMemoResizer(){
    var rz = el('div', {class:'memo-resizer', id:'memo-resizer', role:'separator', 'aria-orientation':'vertical', tabindex:'0',

    rz.addEventListener('pointermove', function(ev){

  /* ---------------------------------------------------------
     기록 파일 — 내보내기 · 가져오기 · 폴더 연결 (2026-10-12)
     - 목적: 로그인 없이도(저장해 둔 .html 파일, 오프라인) 연습 기록 · 중간 저장 · 메모를 파일로 옮기고 합친다.
     - 파일: JSON 한 개(format:'jcb_cbt_records'). 안에 읽기용 목차(readable_index)와 항목별 시각 글자(tsText)가 있어
       각 기록이 언제 쓰였는지 사람이 바로 볼 수 있다. 가져올 때는 이 읽기용 글자를 쓰지 않고 숫자 시각(ts)만 믿는다.
     - 합치기 규칙: 같은 항목이면 ts(고친 시각)가 늦은 쪽이 남는다. 파일에는 있고 이 기기에는 없는 항목은 '추가'한다.
       → 이 기기에서 지웠던 기록이 다른 기기의 파일에 남아 있었다면 되살아날 수 있다(사용자가 허용한 동작). 파일 때문에 이 기기의 것을 지우지는 않는다.
     - 폴더 연결(크롬·엣지 같은 Chromium 계열 컴퓨터 브라우저, 로그인 동기화가 없는 화면에서만): 사용자가 고른 폴더에 jcb_cbt_records.json 을 만들고,
       열 때·창으로 돌아올 때 읽어 합치고, 기록이 바뀌면 다시 쓴다. 이 기기에서 지운 항목은 '지움 표시'(FILETOMB_KEY)로 7일간 기억해
       같은 기기에서 곧바로 되살아나지 않게 한다. 읽을 수 없는 파일(깨진 JSON 등)은 절대 덮어쓰지 않는다.
  --------------------------------------------------------- */
  var FILE = {
    state: 'off',          // 'off'(연결 안 됨) | 'needperm'(연결은 기억하지만 쓰기 허용이 필요) | 'on' | 'error'
    why: '', dir: null, name: '', inp: null,
    lastWrite: 0, lastRead: 0, lastMsg: '', lastRun: 0,
    busy: false, queue: null, again: '', timer: null, retryT: null
  };

  function fileSupported(){
    try{ return typeof window.showDirectoryPicker === 'function' && !(window.claude && typeof window.claude.use === 'function'); }
    catch(e){ return false; }
  }
  function fmtFull(ts){
    var n = +ts;
    if(!isFinite(n) || n <= 0) return '시각 모름';
    var d = new Date(n);
    function p(x){ return (x < 10 ? '0' : '') + x; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function stampName(ts){
    var d = new Date(ts);
    function p(x){ return (x < 10 ? '0' : '') + x; }
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  /* ---- 지움 표시: 폴더 연결 중 '이 기기에서 지운 것'을 파일에서 되살리지 않기 위한 짧은 기억 ---- */
  function loadTomb(){
    var t = safeLS(function(){
      var o = JSON.parse(localStorage.getItem(FILETOMB_KEY) || '{}');
      return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
    }, {});
    var cut = Date.now() - TOMB_DAYS * 86400000;
    Object.keys(t).forEach(function(k){ if(!(+t[k] > cut)) delete t[k]; });
    return t;
  }
  function writeTomb(t){ safeLS(function(){ localStorage.setItem(FILETOMB_KEY, JSON.stringify(t)); return true; }, false); }
  /* 기록·저장·메모가 바뀔 때마다 syncSet/syncDel 이 부른다. quiet=true 이면 파일 쓰기를 예약하지 않는다(파일에서 받아 반영하는 경우). */
  function fileNote(kind, id, op, quiet){
    if(!fileSupported()) return;
    var key = kind + '_' + id, t = loadTomb();
    if(op === 'del') t[key] = Date.now(); else delete t[key];
    writeTomb(t);
    if(!quiet) fileTouch();
  }

  /* ---- 파일 내용 만들기 ---- */
  function validHist(e){ return !!(e && typeof e === 'object' && isFinite(+e.ts) && +e.ts > 0); }
  function recLabel(kind, id, it){
    if(kind === 'hist') return '연습 기록 · ' + (it.sourceLabel || '') + ' · ' + (it.total || '?') + '문항 · ' + (it.mode === 'exam' ? '실전' : '학습') + (it.examCount > 0 ? ' · ' + it.scorePct + '%' : '');
    if(kind === 'save') return '중간 저장 · ' + (it.sourceLabel || '') + ' · ' + (it.answered || 0) + '문항 답함';
    var q = ALL_Q_BY_ID[id];
    var lab = q ? appsText(q, ' / ') : id;
    var t = String(it.t || '').replace(/\s+/g, ' ');
    return '메모 · ' + lab + ' · ' + (t.length > 24 ? t.slice(0, 24) + '…' : t);
  }
  function recWhen(kind, it){
    var s = fmtFull(it.ts);
    if(kind === 'memo' && it.c && +it.c !== +it.ts) s += ' (처음 작성 ' + fmtFull(it.c) + ')';
    return s;
  }
  function withText(kind, it){
    var o = jclone(it);
    o.tsText = fmtFull(it.ts);
    if(kind === 'memo' && it.c) o.cText = fmtFull(it.c);
    return o;
  }
  function buildRecords(){
    var hist = loadHistory().filter(validHist);
    var saves = loadSaves().filter(function(x){ return x && x.id && Array.isArray(x.ids); });
    var all = loadMemos(), memos = {};
    Object.keys(all).forEach(function(q){ var m = all[q]; if(m && typeof m.t === 'string' && m.t.trim()) memos[q] = m; });
    var idx = [];
    hist.forEach(function(e){ idx.push({ts: +e.ts, s: recWhen('hist', e) + ' · ' + recLabel('hist', String(e.ts), e)}); });
    saves.forEach(function(x){ idx.push({ts: +x.ts || 0, s: recWhen('save', x) + ' · ' + recLabel('save', x.id, x)}); });
    Object.keys(memos).forEach(function(q){ idx.push({ts: +memos[q].ts || 0, s: recWhen('memo', memos[q]) + ' · ' + recLabel('memo', q, memos[q])}); });
    idx.sort(function(a, b){ return b.ts - a.ts; });
    var now = Date.now(), outMemos = {};
    Object.keys(memos).forEach(function(q){ outMemos[q] = withText('memo', memos[q]); });
    return {
      format: REC_FORMAT,
      version: REC_VERSION,
      app: '정보처리기사 실기 CBT',
      exportedAt: now,
      exportedAtText: fmtFull(now),
      counts: {hist: hist.length, saves: saves.length, memos: Object.keys(memos).length},
      readable_index: idx.map(function(x){ return x.s; }),
      hist: hist.map(function(e){ return withText('hist', e); }),
      saves: saves.map(function(x){ return withText('save', x); }),
      memos: outMemos
    };
  }
  function recCount(){
    var c = buildRecords().counts;
    return c.hist + c.saves + c.memos;
  }

  /* ---- 파일 읽기: 믿지 않고 하나하나 검사해서 쓸 수 있는 것만 받는다 ---- */
  function sizeOf(o){ try{ return JSON.stringify(o).length; }catch(e){ return 1e9; } }
  function normalizeRecords(rec){
    var lim = Date.now() + 86400000;       // 하루보다 더 미래의 시각은 시계가 틀린 것으로 보고 받지 않는다
    var norm = {hist: {}, save: {}, memo: {}, bad: 0, unknown: 0};
    (Array.isArray(rec.hist) ? rec.hist : []).slice(0, 2000).forEach(function(e){
      if(!validHist(e) || +e.ts > lim) { norm.bad++; return; }
      var it = jclone(e); delete it.tsText; it.ts = +it.ts;
      if(it.results !== undefined && !Array.isArray(it.results)){ norm.bad++; return; }
      if(sizeOf(it) > 240000){ norm.bad++; return; }
      norm.hist[String(it.ts)] = it;
    });
    (Array.isArray(rec.saves) ? rec.saves : []).slice(0, 500).forEach(function(x){
      if(!x || typeof x !== 'object' || typeof x.id !== 'string' || !/^[A-Za-z0-9_-]{1,64}$/.test(x.id) || !Array.isArray(x.ids) || x.ids.length > 1000 ||
         !isFinite(+x.ts) || +x.ts <= 0 || +x.ts > lim){ norm.bad++; return; }
      var it = jclone(x); delete it.tsText; it.ts = +it.ts;
      it.ids = it.ids.filter(function(i){ return typeof i === 'string'; });
      if(sizeOf(it) > 240000){ norm.bad++; return; }
      norm.save[it.id] = it;
    });
    var ms = (rec.memos && typeof rec.memos === 'object' && !Array.isArray(rec.memos)) ? rec.memos : {};
    Object.keys(ms).slice(0, 5000).forEach(function(q){
      var m = ms[q];
      if(!ALL_Q_BY_ID[q]){ norm.unknown++; return; }
      if(!m || typeof m !== 'object' || typeof m.t !== 'string' || !m.t.trim() || !isFinite(+m.ts) || +m.ts <= 0 || +m.ts > lim){ norm.bad++; return; }
      var it = {t: m.t.slice(0, MEMO_MAX), ts: +m.ts};
      if(isFinite(+m.c) && +m.c > 0 && +m.c <= it.ts) it.c = +m.c;
      var mh = m.t.length <= MEMO_MAX ? memoCleanH(m.h) : '';          // 파일의 서식도 정화기를 거친다(글이 잘렸으면 서식은 버린다)
      if(mh){ var mt = meHtmlToText(mh); if(mt.trim() && mt.length <= MEMO_MAX && meBytes(mh) + meBytes(mt) <= MEMO_BYTES_MAX){ it.h = mh; it.t = mt; } }
      norm.memo[q] = it;
    });
    return norm;
  }
  function parseRecords(text){
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rec;
    try{ rec = JSON.parse(text); }
    catch(e){ return {ok: false, msg: 'JSON 형식이 아닙니다(' + (e && e.message ? e.message : '해석 실패') + ')'}; }
    if(!rec || typeof rec !== 'object' || Array.isArray(rec) || rec.format !== REC_FORMAT) return {ok: false, msg: '이 사이트의 기록 파일(format: ' + REC_FORMAT + ')이 아닙니다'};
    if(!(+rec.version >= 1) || +rec.version > REC_VERSION) return {ok: false, msg: '파일 버전(' + rec.version + ')을 이 사이트가 읽지 못합니다. 더 새로운 사이트에서 내보낸 파일일 수 있습니다'};
    return {ok: true, rec: rec, norm: normalizeRecords(rec)};
  }
  function readFileText(f){
    if(f && typeof f.text === 'function') return f.text();
    return new Promise(function(res, rej){
      var r = new FileReader();
      r.onload = function(){ res(String(r.result)); };
      r.onerror = function(){ rej(r.error); };
      r.readAsText(f);
    });
  }

  /* ---- 합치기: 계획(planMerge)을 먼저 세우고, 확인한 뒤(또는 자동으로) 적용(applyPlan)한다 ---- */
  function planMerge(norm, opts){
    var tomb = (opts && opts.useTomb) ? loadTomb() : {};
    var plan = {items: [], same: 0, bad: norm.bad, unknown: norm.unknown, capped: 0, tombed: 0};
    ['hist', 'save', 'memo'].forEach(function(kind){
      var K = KIND[kind], L = K.all(), R = norm[kind], keep = null;
      if(kind === 'hist'){          // 연습 기록은 최근 HIST_MAX 건만 둔다 → 합친 뒤 남을 것만 '추가'로 센다
        var u = {};
        Object.keys(L).forEach(function(id){ u[id] = 1; });
        Object.keys(R).forEach(function(id){ u[id] = 1; });
        keep = {};
        Object.keys(u).sort(function(a, b){ return (+b) - (+a); }).slice(0, HIST_MAX).forEach(function(id){ keep[id] = 1; });
      }
      Object.keys(R).forEach(function(id){
        var r = R[id], l = L[id];
        if(keep && !keep[id]){ plan.capped++; return; }
        var tb = tomb[kind + '_' + id];
        if(tb && K.ts(r) <= tb){ plan.tombed++; return; }          // 이 기기에서 지운 뒤로 고쳐지지 않은 것
        if(!l) plan.items.push({kind: kind, id: id, type: 'add', item: r});
        else if(K.ts(r) > K.ts(l)) plan.items.push({kind: kind, id: id, type: 'upd', item: r});
        else plan.same++;
      });
    });
    return plan;
  }
  function applyPlan(plan, quiet){
    plan.items.forEach(function(p){
      var it = p.item;
      if(p.kind === 'memo'){            // 처음 작성한 시각은 더 이른 쪽을 남긴다
        var l = loadMemos()[p.id];
        if(l && +l.c > 0 && (!it.c || +l.c < +it.c)) it.c = +l.c;
      }
      KIND[p.kind].put(p.id, it);
      syncSet(p.kind, p.id, it, quiet);
    });
    var hm = KIND.hist.all();
    Object.keys(hm).sort(function(a, b){ return (+b) - (+a); }).slice(HIST_MAX).forEach(function(id){
      KIND.hist.del(id); syncDel('hist', id, quiet);
    });
    migrateMemoAliases();                    // 합쳐지기 전 id 로 적힌 메모가 파일에서 들어왔으면 남은 문항으로 옮긴다
  }
  /* 이 기기에 파일보다 새롭거나 파일에 없는 항목이 있는가(= 파일을 다시 써야 하는가) */
  function localNewerThan(norm){
    var newer = false;
    ['hist', 'save', 'memo'].forEach(function(kind){
      var K = KIND[kind], L = K.all();
      Object.keys(L).forEach(function(id){
        var r = norm[kind][id];
        if(!r || K.ts(L[id]) > K.ts(r)) newer = true;
      });
    });
    return newer;
  }
  function planCounts(plan){
    var add = 0, upd = 0;
    plan.items.forEach(function(p){ if(p.type === 'add') add++; else upd++; });
    return {add: add, upd: upd};
  }

  /* ---- 내보내기 ---- */
  function anchorDownload(name, text){
    try{
      var blob = new Blob([text], {type: 'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      return {ok: true, how: 'anchor'};
    }catch(e){ return {ok: false, how: 'none'}; }
  }
  /* Artifact 화면에서는 파일 내려받기 링크가 막혀 있어, 보는 사람의 확인을 받는 downloads 기능으로만 저장한다. */
  function saveTextFile(name, text){
    var c = window.claude;
    if(c && typeof c.use === 'function'){
      return c.use('downloads').then(function(dl){
        if(!dl || typeof dl.save !== 'function') return {ok: false, how: 'none'};
        return dl.save({filename: name, data: text}).then(
          function(){ return {ok: true, how: 'cap'}; },
          function(e){ return {ok: false, how: 'cap', declined: !!(e && e.code === 'declined'), code: e && e.code}; });
      }, function(){ return {ok: false, how: 'none'}; });
    }
    return Promise.resolve(anchorDownload(name, text));
  }
  function showTextFallback(name, text){
    var ta = el('textarea', {class: 'copy-textarea', readonly: ''});
    ta.value = text;
    openModal({
      title: '파일로 저장할 수 없어 글로 보여 드립니다',
      body: '이 화면에서는 파일 저장이 막혀 있습니다. 아래 글을 모두 복사해 메모장에 붙여넣고 ' + name + ' 이름으로 저장하면 같은 파일이 됩니다.',
      confirmText: '닫기', node: ta, wide: true
    });
    try{ ta.focus(); ta.select(); }catch(e){}
  }
  function exportRecords(){
    var rec = buildRecords();
    if(rec.counts.hist + rec.counts.saves + rec.counts.memos === 0){
      showToast('내보낼 내용이 아직 없습니다(연습 기록 · 중간 저장 · 메모가 모두 비어 있음).', 'bad');
      return;
    }
    var name = 'jcb_cbt_records_' + stampName(rec.exportedAt) + '.json';
    var text = JSON.stringify(rec, null, 1);
    var sumTxt = '연습 기록 ' + rec.counts.hist + ' · 중간 저장 ' + rec.counts.saves + ' · 메모 ' + rec.counts.memos;
    saveTextFile(name, text).then(function(r){
      if(r.ok && r.how === 'anchor'){
        showToast('내보냈습니다: ' + name + ' (' + sumTxt + '). 브라우저의 다운로드 폴더를 확인하세요' + (fileSupported() ? ' — HTML과 같은 폴더에 두려면 [폴더 연결]을 쓰세요.' : '.'));
      } else if(r.ok){
        showToast('내보냈습니다: ' + name + ' (' + sumTxt + ').');
      } else if(r.declined){
        showToast('저장을 취소했습니다.');
      } else {
        showTextFallback(name, text);
      }
    });
  }

  /* ---- 가져오기 ---- */
  function pickRecordsFile(){
    if(!FILE.inp){
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json'; inp.id = 'rec-file'; inp.style.display = 'none';
      inp.addEventListener('change', function(){
        var f = inp.files && inp.files[0];
        if(f) importFromFile(f);
        try{ inp.value = ''; }catch(e){}
      });
      document.body.appendChild(inp);
      FILE.inp = inp;
    }
    FILE.inp.click();
  }
  function importFromFile(f){
    if(f.size > REC_MAX_BYTES){ showToast('파일이 너무 큽니다(30MB 초과). 이 사이트의 기록 파일이 맞는지 확인해 주세요.', 'bad'); return; }
    readFileText(f).then(function(text){
      var res = parseRecords(text);
      if(!res.ok){ showToast('가져오지 못했습니다: ' + res.msg + '.', 'bad'); return; }
      showImportSummary(f.name, res, planMerge(res.norm, {useTomb: false}));
    }, function(){ showToast('파일을 읽지 못했습니다.', 'bad'); });
  }
  function showImportSummary(fname, res, plan){
    var n = plan.items.length, c = planCounts(plan);
    var skipTxt = (plan.bad ? ' · 형식 오류로 건너뜀 ' + plan.bad + '건' : '') + (plan.unknown ? ' · 이 사이트에 없는 문항의 메모 ' + plan.unknown + '건 건너뜀' : '') + (plan.capped ? ' · 기록 보관 한도(' + HIST_MAX + '건) 밖이라 제외 ' + plan.capped + '건' : '');
    if(!n){
      showToast('합칠 새 내용이 없습니다(모두 이미 같거나 이 기기 쪽이 더 최신입니다' + skipTxt + ').');
      return;
    }
    var list = el('div', {class: 'imp-list', role: 'list'});
    var rows = plan.items.slice().sort(function(a, b){ return KIND[b.kind].ts(b.item) - KIND[a.kind].ts(a.item); });
    rows.slice(0, 60).forEach(function(p){
      list.appendChild(el('div', {class: 'imp-row', role: 'listitem'}, [
        el('span', {class: 'imp-badge ' + p.type, text: p.type === 'add' ? '추가' : '갱신'}),
        el('span', {class: 'imp-when', text: recWhen(p.kind, p.item)}),
        el('span', {class: 'imp-label', text: recLabel(p.kind, p.id, p.item)})
      ]));
    });
    if(rows.length > 60) list.appendChild(el('div', {class: 'imp-more', text: '… 외 ' + (rows.length - 60) + '건'}));
    openModal({
      title: '기록 파일 가져오기',
      body: '파일: ' + fname + (res.rec.exportedAtText ? ' (내보낸 시각 ' + res.rec.exportedAtText + ')' : '') +
        ' — 새로 추가 ' + c.add + '건 · 더 최신이라 갱신 ' + c.upd + '건 · 이미 같거나 이 기기가 더 최신 ' + plan.same + '건' + skipTxt + '. ' +
        '합치기는 이 기기의 기록을 지우지 않습니다. 다만 이 기기에서 지웠던 기록이 파일에 남아 있으면 되살아날 수 있으니, 아래에 적힌 작성 시각으로 구분하세요.',
      node: list, wide: true,
      cancelText: '취소', confirmText: '합치기',
      onConfirm: function(){
        var fresh = planMerge(res.norm, {useTomb: false});      // 확인하는 사이 바뀐 것까지 반영해 다시 계산
        applyPlan(fresh, false);
        var fc = planCounts(fresh);
        if(S.screen === 'home') renderHome(); else refreshViews();
        showToast('합쳤습니다: 새로 ' + fc.add + '건 · 갱신 ' + fc.upd + '건.');
      }
    });
  }

  /* ---- 폴더 연결 ---- */
  function fileIdb(){
    return new Promise(function(res){
      try{
        var r = indexedDB.open('jcb_cbt_files_v1', 1);
        r.onupgradeneeded = function(){ try{ r.result.createObjectStore('h'); }catch(e){} };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ res(null); };
        r.onblocked = function(){ res(null); };
      }catch(e){ res(null); }
    });
  }
  function fileIdbOp(mode, fn){
    return fileIdb().then(function(db){
      if(!db) return null;
      return new Promise(function(res){
        try{
          var tx = db.transaction('h', mode), out = null;
          fn(tx.objectStore('h'), function(v){ out = v; });
          tx.oncomplete = function(){ db.close(); res(out); };
          tx.onerror = tx.onabort = function(){ try{ db.close(); }catch(e){} res(null); };
        }catch(e){ try{ db.close(); }catch(x){} res(null); }
      });
    });
  }
  function fileIdbGet(){ return fileIdbOp('readonly', function(st, set){ var rq = st.get('dir'); rq.onsuccess = function(){ set(rq.result || null); }; }); }
  function fileIdbPut(h){ return fileIdbOp('readwrite', function(st){ st.put(h, 'dir'); }); }
  function fileIdbDel(){ return fileIdbOp('readwrite', function(st){ st.delete('dir'); }); }

  function setFile(state, why){
    FILE.state = state; FILE.why = why || '';
    updateFileUI();
  }
  function filePerm(ask){
    var h = FILE.dir;
    if(!h || typeof h.queryPermission !== 'function') return Promise.resolve('granted');
    var o = {mode: 'readwrite'};
    return h.queryPermission(o).then(function(p){
      if(p === 'granted' || !ask) return p;
      return h.requestPermission(o);
    }, function(){ return 'denied'; });
  }
  function fileConnect(){
    if(!fileSupported()) return;
    var pick;
    try{ pick = window.showDirectoryPicker({id: 'jcb_cbt_records', mode: 'readwrite'}); }
    catch(e){ showToast('폴더 선택 창을 열지 못했습니다.', 'bad'); return; }
    pick.then(function(h){
      FILE.dir = h; FILE.name = h.name || '';
      fileIdbPut(h);
      FILE.lastMsg = '';
      return fileSyncNow('connect');
    }, function(e){
      if(e && e.name === 'AbortError'){
        showToast('폴더를 고르지 않았거나 브라우저가 그 폴더를 허용하지 않았습니다. 문서·다운로드·바탕화면 같은 폴더 자체는 막힐 수 있으니(추정) 그 안에 새 폴더를 만들어 HTML 파일과 함께 두고 다시 시도해 보세요.');
      } else if(e && e.name === 'SecurityError'){
        showToast('이 화면에서는 폴더 선택이 막혀 있습니다. 저장해 둔 HTML 파일을 크롬·엣지로 직접 열어 사용하세요.', 'bad');
      } else {
        showToast('폴더를 연결하지 못했습니다: ' + (e && e.message ? e.message : e), 'bad');
      }
    });
  }
  function fileRestore(){
    if(!FILE.dir) return;
    filePerm(true).then(function(p){
      if(p === 'granted') return fileSyncNow('restore');
      showToast('쓰기 허용을 받지 못했습니다. 브라우저의 허용 창에서 [허용]을 눌러 주세요.', 'bad');
    });
  }
  function fileDisconnect(){
    clearTimeout(FILE.timer); FILE.timer = null; clearTimeout(FILE.retryT); FILE.retryT = null;
    FILE.dir = null; FILE.name = ''; FILE.lastMsg = '';
    fileIdbDel();
    setFile('off', '');
    showToast('폴더 연결을 해제했습니다. 폴더에 있는 ' + FILE_NAME + ' 파일은 그대로 남아 있습니다.');
  }
  function fileReadRec(){
    return FILE.dir.getFileHandle(FILE_NAME).then(function(fh){
      return fh.getFile().then(function(f){
        if(f.size > REC_MAX_BYTES) return {state: 'bad', msg: FILE_NAME + ' 파일이 너무 큽니다(30MB 초과). 덮어쓰지 않았습니다.'};
        return readFileText(f).then(function(text){
          if(!text.trim()) return {state: 'none'};
          var r = parseRecords(text);
          return r.ok ? {state: 'ok', rec: r.rec, norm: r.norm}
                      : {state: 'bad', msg: FILE_NAME + ': ' + r.msg + ' — 파일을 덮어쓰지 않았습니다. 파일을 확인한 뒤 [지금 맞추기]를 눌러 주세요.'};
        });
      });
    }, function(e){
      if(e && e.name === 'NotFoundError') return {state: 'none'};
      throw e;
    });
  }
  function fileWriteRec(){
    var text = JSON.stringify(buildRecords(), null, 1);
    return FILE.dir.getFileHandle(FILE_NAME, {create: true}).then(function(fh){
      return fh.createWritable().then(function(w){
        return w.write(text).then(function(){ return w.close(); }, function(e){ try{ w.abort(); }catch(x){} throw e; });
      });
    });
  }
  function scheduleFileRetry(){
    if(FILE.retryT) return;
    FILE.retryT = setTimeout(function(){ FILE.retryT = null; fileSyncNow('retry'); }, 15000);
  }
  /* 읽기 → 합치기 → (필요하면) 쓰기. 한 번에 하나만 돌고, 도는 중에 요청이 오면 끝난 뒤 한 번 더 돈다. */
  function fileSyncNow(reason){
    if(!FILE.dir) return Promise.resolve();
    if(FILE.busy){ FILE.again = reason || 'change'; return FILE.queue; }
    FILE.busy = true; FILE.lastRun = Date.now();
    clearTimeout(FILE.timer); FILE.timer = null;
    FILE.queue = fileReadRec().then(function(rd){
      if(rd.state === 'bad'){ setFile('error', rd.msg); scheduleFileRetry(); return; }      // 읽을 수 없는 파일은 덮어쓰지 않는다
      var plan = null, c = {add: 0, upd: 0};
      if(rd.state === 'ok'){
        plan = planMerge(rd.norm, {useTomb: true});
        if(plan.items.length){ c = planCounts(plan); applyPlan(plan, true); refreshViews(); }
        FILE.lastRead = Date.now();
      }
      var need;
      if(reason === 'connect') need = true;
      else if(rd.state === 'none') need = recCount() > 0;
      else need = !!(plan.tombed || plan.capped || localNewerThan(rd.norm));
      var done = function(wrote){
        if(wrote) FILE.lastWrite = Date.now();
        FILE.lastMsg = (c.add + c.upd) ? ('파일에서 합친 ' + (c.add + c.upd) + '건(새로 ' + c.add + ' · 갱신 ' + c.upd + ')') : '';
        if(c.add + c.upd){
          showToast('폴더의 ' + FILE_NAME + ' 에서 ' + (c.add + c.upd) + '건을 합쳤습니다(새로 ' + c.add + ' · 갱신 ' + c.upd + '). 지웠던 기록이 되살아났을 수 있으니 작성 시각을 확인하세요.');
        } else if(reason === 'connect'){
          showToast('폴더를 연결했습니다. “' + FILE.name + '” 폴더에 ' + FILE_NAME + ' 을(를) 만들어 기록을 저장합니다.');
        }
        setFile('on', '');
      };
      if(!need){ done(false); return; }
      return fileWriteRec().then(function(){ done(true); });
    }).then(null, function(e){
      var nm = e && e.name;
      if(nm === 'NotAllowedError' || nm === 'SecurityError') setFile('needperm', '');
      else if(nm === 'NotFoundError') setFile('error', '연결한 폴더를 찾을 수 없습니다. [폴더 연결]로 다시 연결해 주세요.');
      else { setFile('error', (e && e.message) ? String(e.message) : '파일을 읽거나 쓰지 못했습니다.'); scheduleFileRetry(); }
    }).then(function(){
      FILE.busy = false;
      if(FILE.again){ var a = FILE.again; FILE.again = ''; return fileSyncNow(a); }
    });
    return FILE.queue;
  }
  /* 기록이 바뀌었을 때(fileNote 에서): 잠시 모아서 한 번에 맞춘다 */
  function fileTouch(){
    if(!FILE.dir || FILE.state === 'needperm') return;
    clearTimeout(FILE.timer);
    FILE.timer = setTimeout(function(){ FILE.timer = null; fileSyncNow('change'); }, 1500);
  }
  function initFile(){
    if(!fileSupported()){ updateFileUI(); return; }
    fileIdbGet().then(function(h){
      if(!h || h.kind !== 'directory'){ updateFileUI(); return; }
      FILE.dir = h; FILE.name = h.name || '';
      return filePerm(false).then(function(p){
        if(p === 'granted') fileSyncNow('open');
        else setFile('needperm', '');
      });
    });
  }
  document.addEventListener('visibilitychange', function(){
    if(!FILE.dir) return;
    if(document.visibilityState === 'hidden'){ if(FILE.timer) fileSyncNow('leave'); }
    else if(FILE.state === 'on' && Date.now() - FILE.lastRun > 5000) fileSyncNow('focus');
  });
  window.addEventListener('pagehide', function(){ if(FILE.dir && FILE.timer) fileSyncNow('leave'); });

  /* ---- 화면: 처음 화면의 '기록 파일' 구역 ---- */

  /* 처음 화면 맨 위의 '이어서 풀기' 구역. 저장본이 없으면 아무것도 그리지 않는다. */

        : '저장본은 이 브라우저에만 남으며 다른 기기와 공유되지 않습니다(옮기려면 아래 \'기록 파일\'의 내보내기·가져오기). 불러온 풀이를 제출하면 그 저장본은 자동으로 지워집니다.');

        : '아직 연습 기록이 없습니다. 이 브라우저에만 저장되며 다른 기기와 공유되지 않습니다(옮기려면 \'기록 파일\'의 내보내기·가져오기).');
  }

  /* ---------------------------------------------------------
     답안 입력칸 자동 선택 (2026-10-12)
     - 문항이 나타나면 입력칸에 커서를 미리 두어, 클릭 없이 바로 타자를 칠 수 있게 한다.
     - 칸이 여러 개(번호별 답안란)면 '비어 있는 첫 칸', 모두 찼으면 첫 칸. 이미 쓴 글은 지우지 않고 맨 끝에 커서를 둔다.
     - preventScroll: 포커스가 화면을 입력칸 쪽으로 끌고 내려가 긴 지문(코드)의 윗부분이 가려지는 것을 막는다.
     - 마우스·키보드가 있는 기기((hover:hover) and (pointer:fine))에서만 켠다. 폰·태블릿 터치 화면에서는 문항이
       바뀔 때마다 화면 키보드가 올라와 지문을 가리므로 켜지 않는다.
     - 모달이 떠 있거나, 정답을 공개해 입력칸이 잠긴 문항(학습 모드)에서는 아무것도 하지 않는다.
  --------------------------------------------------------- */
  var CAN_AUTOFOCUS = (function(){
    try{ return !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches); }
    catch(e){ return false; }
  })();
  /* 마지막으로 커서가 있던 답안 칸을 기억해 둔다. 버튼(저장·복사·확인창 취소)을 누르고 돌아올 때
     번호별 칸에서 쓰던 ② 칸이 아니라 첫 칸으로 커서가 튀지 않게, 있던 칸 그대로 되돌리기 위해서다. */
  var lastAnswerEl = null;
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(t && t.classList && t.classList.contains('answer-input') && t.closest && t.closest('#exam-main')) lastAnswerEl = t;
  });
  /* keepLast=true: 직전에 쓰던 칸이 아직 화면에 있으면 그 칸으로(커서 위치도 그대로). 아니면 기본 규칙. */
  function focusAnswerInput(keepLast){
    if(!CAN_AUTOFOCUS || S.screen !== 'exam' || $('#active-modal')) return;
    if(keepLast === true && lastAnswerEl && lastAnswerEl.isConnected && !lastAnswerEl.disabled){
      try{ lastAnswerEl.focus({preventScroll:true}); return; }catch(e){ /* 아래 기본 규칙으로 */ }
    }
    var fields = $all('#exam-main .answer-wrap .answer-input').filter(function(f){ return !f.disabled; });
    if(fields.length === 0) return;
    var target = fields[0];
    for(var i=0; i<fields.length; i++){
      if(!fields[i].value.trim()){ target = fields[i]; break; }
    }
    try{
      target.focus({preventScroll:true});
      var n = target.value.length;
      if(target.setSelectionRange) target.setSelectionRange(n, n);
    }catch(e){ /* 포커스 실패는 기능 손실일 뿐 오류가 아니다 */ }
  }

  /* ---------------------------------------------------------
     코드 문제 복사 (2026-10-12)
     - AI 에이전트에 붙여넣어 질문하기 좋게, 문항을 '글'로 만들어 클립보드에 넣는다.
     - [코드만 복사] = 코드 원문 그대로. [문제 전체 복사] = 문제 + 코드 + 내 답안(입력했다면).
       정답·해설은 화면에 이미 공개된 경우(학습 모드 정답 확인 뒤, 결과 화면)에만 넣는다.
       실전 모드 풀이 중에는 넣지 않는다 — 에이전트에 붙여넣다가 정답이 먼저 새는 일을 막으려는 것이다.
     - 표는 마크다운 표로, 그림은 글로 옮길 수 없어 자리 표시만 남긴다.
  --------------------------------------------------------- */
  function mdCell(t){ return String(t == null ? '' : t).replace(/\|/g, '\\|').replace(/\s*\n\s*/g, ' '); }
  function tableToMd(rows, caption, header){
    var out = [];
    if(caption) out.push(caption);
    if(!rows || !rows.length) return out.join('\n');
    var cols = 0;
    rows.forEach(function(r){ if(r.length > cols) cols = r.length; });
    function line(r){ var c = []; for(var i=0; i<cols; i++) c.push(mdCell(r[i])); return '| ' + c.join(' | ') + ' |'; }
    var head = header !== false ? rows[0] : [];
    var body = header !== false ? rows.slice(1) : rows;
    out.push(line(head));
    out.push('|' + new Array(cols + 1).join(' --- |'));
    body.forEach(function(r){ out.push(line(r)); });
    return out.join('\n');
  }
  function promptToText(q){
    var blocks = q.prompt_blocks;
    if(!blocks || !blocks.length) return q.prompt || '';
    return blocks.map(function(b){
      if(b.kind === 'table') return '\n' + tableToMd(b.rows, b.caption, b.header !== false) + '\n';
      if(b.kind === 'image') return '[그림: ' + (b.alt || '그림') + (b.caption ? ' — ' + b.caption : '') + '] (그림은 글로 복사되지 않습니다)';
      return (b.lines || []).join('\n');
    }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  function answerToText(q, value){
    if(q.answer_parts){
      var got = partsOf(q, value);
      return q.answer_parts.map(function(p, i){ return partLineText({label:p.label, value: got[i].trim() ? got[i] : '(빈칸)'}); }).join('\n');
    }
    return String(value || '').replace(/\s+$/, '');
  }
  function codeOnlyText(q){ return String(q.code || '').replace(/\s+$/, ''); }
  /* opts: {mine: 내가 입력한 답(문자열), reveal: 정답·해설 포함 여부, status: 채점 결과 글자(있으면 표시)} */
  function buildCopyText(q, opts){
    opts = opts || {};
    var out = ['[정보처리기사 실기 복원문제 · ' + appsText(q, ' / ') + ' · ' + q.language + ']', '', '■ 문제', promptToText(q)];
    if(q.code && q.code.trim()){
      out.push('', '■ 코드', '```' + (q.lang_hint || ''), codeOnlyText(q), '```');
    } else if(q.code_table){
      out.push('', '■ 표', tableToMd(q.code_table, null, true));
    }
    var mine = opts.mine || '';
    if(mine.trim()){
      out.push('', '■ 내 답안' + (opts.status ? ' (채점: ' + opts.status + ')' : ''), answerToText(q, mine));
    } else if(opts.reveal){
      out.push('', '■ 내 답안: (미답변)');
    }
    if(opts.reveal){
      out.push('', '■ ' + (q.grading === 'exact' ? '정답' : '모범답안'), modelAnswerText(q));
      if(q.explanation){
        out.push('', '■ 해설', (q.explanation_lines && q.explanation_lines.length > 1) ? q.explanation_lines.join('\n') : q.explanation);
      }
    }
    if(q.source_url) out.push('', '(출처: ' + q.source_url + ')');
    return out.join('\n');
  }
  /* 클립보드에 글을 넣는다. 1) 표준 API → 2) 옛 방식(execCommand) 순으로 시도하고, 성공 여부(true/false)를 돌려준다. */
  function copyText(text){
    function legacy(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed; top:0; left:0; opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return !!ok;
      }catch(e){ return false; }
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return legacy(); });
      }
    }catch(e){ /* 아래 옛 방식으로 */ }
    return Promise.resolve(legacy());
  }
  /* 자동 복사가 막힌 환경: 글을 보여주고 전체 선택해 두어 Ctrl+C 한 번이면 되게 한다. */
  function showCopyFallback(text){
    var ta = el('textarea', {class:'copy-textarea', readonly:''});
    ta.value = text;
    openModal({
      title:'복사하기',
      body:'이 환경에서는 자동 복사가 막혀 있습니다. 아래 글이 모두 선택되어 있으니 Ctrl+C(맥은 ⌘C)로 복사하세요.',
      confirmText:'닫기',
      node:ta,
      wide:true
    });
    try{ ta.focus(); ta.select(); }catch(e){}
  }
  function buildCopyBtn(label, getText){
    return el('button', {type:'button', class:'btn btn-sm copy-btn', text:label,
      title:'AI 에이전트에 붙여넣어 질문할 수 있게 글로 복사합니다',
      // 누르는 순간 입력칸에서 포커스가 빠지지 않게 한다(복사하고 바로 이어서 타자를 칠 수 있게)
      onmousedown:function(e){ e.preventDefault(); },
      onclick:function(ev){
        var btn = ev.currentTarget;
        var text = getText();
        copyText(text).then(function(ok){
          if(ok){
            btn.textContent = '✓ 복사됨'; btn.classList.add('copied');
            setTimeout(function(){ btn.textContent = label; btn.classList.remove('copied'); }, 1600);
            showToast('복사했습니다 · ' + label.replace(' 복사', '') + ' (' + text.length + '자) — AI 에이전트 입력창에 붙여넣으세요.');
          } else {
            showCopyFallback(text);
          }
          focusAnswerInput(true);
        });
      }});
  }
  /* 코드 문제 위에 두는 복사 도구줄. getOpts 는 누를 때마다 불러 그 순간의 답안·공개 상태를 반영한다. */
  function buildCopyTools(q, getOpts){
    return el('div', {class:'code-tools'}, [
      buildCopyBtn('코드만 복사', function(){ return codeOnlyText(q); }),
      buildCopyBtn('문제 전체 복사', function(){ return buildCopyText(q, getOpts()); })
    ]);
  }

  var toastTimer = null;
  function showToast(msg, kind){
    var root = $('#toast-root');
    if(!root) return;
    root.innerHTML = '';
    var t = el('div', {class:'toast' + (kind==='bad' ? ' bad' : ''), text:msg});
    root.appendChild(t);
    void t.offsetWidth;            // 처음 상태를 한 번 그려야 나타나는 전환 효과가 작동한다
    t.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      t.classList.remove('show');
      setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 260);
    }, kind==='bad' ? 5200 : 3600);
  }

  /* 정답 채점 — 사용자 결정: "완전일치"(공백 한 칸이라도 다르면 오답). 다만 입력창 앞뒤의
     의도치 않은 공백/줄바꿈(브라우저가 자동으로 붙이는 것)까지 오답으로 잡는 건 과하므로,
     문자열 전체의 앞뒤 공백만 trim하고 내부 공백/대소문자는 그대로 비교한다. */
  /* 번호별 칸 한 개의 채점. 정답 value 와 같거나, 같은 식의 다른 표기(alts, 예: 괄호를 친 꼴)와 같으면 맞다. */
  function partOk(p, val){
    var v = (val || '').trim();
    if(v === (p.value || '').trim()) return true;
    return (p.alts || []).some(function(a){ return v === String(a).trim(); });
  }
  function gradeExact(q, inputValue){
    var a = (inputValue||'').trim();
    var b = (q.answer||'').trim();
    if(a.length>0 && a === b) return true;     // 칸을 나누기 전에 저장된 예전 기록도 그대로 채점한다
    if(a.length>0 && (q.answer_alts || []).some(function(x){ return a === String(x).trim(); })) return true;   // 같은 뜻의 다른 표기(예: 문장 끝 세미콜론 생략)
    if(q.answer_parts && q.answer_alts && q.answer_alts.length && a.length>0){
      // 칸이 나뉜 문항의 '통째 다른 표기'(칸을 줄바꿈으로 이은 문자열) — 칸마다 앞뒤 공백만 지운 꼴로도 비교한다
      var gp = partsOf(q, inputValue).map(function(s){ return s.trim(); }).join('\n');
      if(q.answer_alts.some(function(x){ return gp === String(x).split('\n').map(function(s){ return s.trim(); }).join('\n'); })) return true;
    }
    if(q.answer_parts){
      // 번호별 답안란: 칸마다 완전일치(앞뒤 공백만 무시)여야 하고, 한 칸이라도 틀리거나 비면 오답
      if(a.length === 0) return false;
      var got = partsOf(q, inputValue);
      return q.answer_parts.every(function(p, i){ return partOk(p, got[i]); });
    }
    return false;
  }

  /* 문항 하나의 채점 상태를 계산.
     exact: unanswered | correct | wrong
     self : unanswered | pending(답은 적었지만 아직 본인이 맞음/틀림 체크 안함) | correct | wrong */
  function computeStatus(q, inputValue, selfMark){
    var answered = !!(inputValue && inputValue.trim().length>0);
    if(q.grading === 'exact'){
      if(!answered) return 'unanswered';
      return gradeExact(q, inputValue) ? 'correct' : 'wrong';
    }
    // 서술형은 입력창에 아무것도 안 적었더라도(머릿속으로만 답하고) 자가채점 버튼을 누를 수 있으므로,
    // 마크가 있으면 입력 여부와 무관하게 그 마크를 우선한다.
    if(selfMark === true) return 'correct';
    if(selfMark === false) return 'wrong';
    if(!answered) return 'unanswered';
    return 'pending';
  }

  function applyHighlight(container){
    if(!window.hljs) return;
    $all('pre code', container).forEach(function(block){
      try{ window.hljs.highlightElement(block); }catch(e){ /* CDN 로드 실패 시 그냥 무강조로 둔다 */ }
    });
  }

  function buildCodeBlock(code, langHint){
    var wrap = el('div', {class:'q-code'});
    var pre = el('pre');
    var codeEl = el('code', {class: langHint ? 'language-'+langHint : ''});
    codeEl.textContent = code;
    pre.appendChild(codeEl);
    wrap.appendChild(pre);
    return wrap;
  }

  /* 지문 그리기 — data.json 의 prompt_blocks([{kind:inst|body|opt|table|image, box, lines|rows|file}])를
     줄·블록 단위 DOM 으로 만든다. box=true 인 연속 블록(표 제외)은 하나의 네모칸에 담는다.
     prompt_blocks 가 없으면(이전 형식 데이터) prompt 문자열을 그대로 보여준다. 모든 글은 textContent 로 넣는다. */
  function buildTableNode(rows, caption, header){
    /* 열이 아주 많은 표(예: 테스트 케이스 15열)는 좁은 화면에서 가로 스크롤 없이는 들어가지 않으므로,
       좁은 화면에서만 행과 열을 바꿔(전치) 세로로 길게 보여준다. 내용은 그대로, 읽는 방향만 바뀐다. */
    if(header !== false && rows.length && rows[0].length >= 10 && window.innerWidth < 600){
      rows = rows[0].map(function(_, c){ return rows.map(function(r){ return r[c] || ''; }); });
    }
    var wrap = el('div', {class:'pb-table-wrap'});
    if(caption) wrap.appendChild(el('div', {class:'pb-table-cap', text:caption}));
    var tbl = el('table', {class:'pb-table'});
    rows.forEach(function(r, ri){
      var tr = el('tr');
      r.forEach(function(c){ tr.appendChild(el(header && ri===0 ? 'th' : 'td', {text:c})); });
      tbl.appendChild(tr);
    });
    wrap.appendChild(tbl);
    return wrap;
  }
  function buildBlockNode(b){
    if(b.kind === 'image'){
      var fig = el('div', {class:'pb-block pb-figure'});
      var wpx = Math.round((b.w || 800) / 2);          // 그림은 2배 해상도로 그려 두었다
      fig.appendChild(el('img', {class:'pb-img', alt:b.alt || '그림', src:(b.src || b.file), width:wpx, style:'width:' + wpx + 'px;'}));
      if(b.caption) fig.appendChild(el('div', {class:'pb-cap', text:b.caption}));
      return fig;
    }
    var d = el('div', {class:'pb-block pb-' + b.kind});
    (b.lines || []).forEach(function(t){ d.appendChild(el('div', {class:'pb-line', text:t})); });
    return d;
  }
  function buildPromptNode(q){
    var wrap = el('div', {class:'q-prompt'});
    var blocks = q.prompt_blocks;
    if(!blocks || !blocks.length){
      wrap.className = 'q-prompt plain';
      wrap.textContent = q.prompt;
      return wrap;
    }
    var i = 0;
    while(i < blocks.length){
      var b = blocks[i];
      if(b.kind === 'table'){
        wrap.appendChild(buildTableNode(b.rows, b.caption, b.header !== false));
        i++;
      } else if(b.box){
        var box = el('div', {class:'pb-box'});
        while(i < blocks.length && blocks[i].box && blocks[i].kind !== 'table'){
          box.appendChild(buildBlockNode(blocks[i])); i++;
        }
        wrap.appendChild(box);
      } else {
        wrap.appendChild(buildBlockNode(b)); i++;
      }
    }
    return wrap;
  }
  /* 해설: 원문 explanation 은 그대로 두고, 항목을 줄로 나눈 explanation_lines 가 있으면 줄별로 보여준다 */
  function buildExplNode(q){
    var d = el('div');
    if(q.explanation_lines && q.explanation_lines.length > 1){
      q.explanation_lines.forEach(function(t, k){
        d.appendChild(el('div', {class:'expl-line', style: k>0 ? 'padding-left:14px;' : null, text:t}));
      });
    } else {
      d.textContent = q.explanation;
    }
    return d;
  }
  /* 번호별 답안란. 값은 칸 사이를 줄바꿈('\n')으로 이은 문자열 하나로 보관한다(기록·채점 코드를 그대로 쓰기 위해). */
  function partsOf(q, value){
    var n = q.answer_parts.length;
    var arr = String(value || '').split('\n');
    while(arr.length < n) arr.push('');
    return arr.slice(0, n);
  }
  function partLabelText(label){ return /^[0-9]+$/.test(label) ? '(' + label + ')' : label; }
  function partLineText(p){
    if(/^[0-9]+$/.test(p.label)) return '(' + p.label + ') ' + p.value;
    if(/^[①-⑳ㄱ-ㅎ]$/.test(p.label)) return p.label + ' ' + p.value;
    return p.label + ': ' + p.value;
  }
  /* '이 표기도 정답으로 인정' 한 줄. 칸이 나뉜 문항이면 칸 이름을 붙여 보여 준다(예: (a): %, (b): 5). */
  function altAnswerText(q, a){
    if(!q.answer_parts) return String(a).replace(/\n/g, ' ⏎ ');
    return String(a).split('\n').map(function(s, i){
      var p = q.answer_parts[i];
      return p ? partLineText({label:p.label, value:s}) : s;
    }).join(', ');
  }
  function modelAnswerText(q){
    return q.answer_parts ? q.answer_parts.map(partLineText).join('\n') : q.answer;
  }
  /* opts: {disabled, mark(칸별 맞음/틀림 색 표시), onChange(이어붙인 값)} */
  function buildAnswerFields(q, value, opts){
    var vals = partsOf(q, value);
    var wrap = el('div', {class:'answer-parts'});
    var inputs = [];
    var wholeOk = !!opts.mark && gradeExact(q, value);     // 통째 다른 표기(answer_alts)로 맞았으면 모든 칸을 맞음으로 칠한다
    q.answer_parts.forEach(function(p, i){
      var isNum = /^[0-9]+$/.test(p.label);
      var inp = el('input', {class:'answer-input', type:'text',
        placeholder: opts.disabled ? (vals.join('').trim() ? '' : '(미답변)') : '정답 입력',
        'aria-label': isNum ? (p.label + '번 답안') : (p.label + ' 답안')});
      inp.value = vals[i];
      if(opts.disabled) inp.disabled = true;
      if(opts.mark) inp.classList.add((wholeOk || partOk(p, vals[i])) ? 'ap-ok' : 'ap-ng');
      inputs.push(inp);
      inp.addEventListener('input', function(){
        if(opts.onChange) opts.onChange(inputs.map(function(x){ return x.value; }).join('\n'));
      });
      inp.addEventListener('keydown', function(ev){          // Enter 로 다음 칸으로 이동
        if(ev.key === 'Enter'){ ev.preventDefault(); if(inputs[i+1]) inputs[i+1].focus(); }
      });
      wrap.appendChild(el('label', {class:'ap-row'}, [el('span', {class:'ap-label', text:partLabelText(p.label)}), inp]));
    });
    return wrap;
  }
  function buildCodeOrTable(q){
    if(q.code_table) return buildTableNode(q.code_table, null, true);
    if(q.code && q.code.trim()) return buildCodeBlock(q.code, q.lang_hint);
    return null;
  }

  /* ---------------------------------------------------------
     모달
  --------------------------------------------------------- */
  function openModal(opts){
    closeModal();
    var root = $('#modal-root');
    var box = el('div', {class:'modal-box' + (opts.wide ? ' modal-box-wide' : '')}, [
      el('h3', {text: opts.title}),
      el('p', {text: opts.body})
    ]);
    if(opts.node) box.appendChild(opts.node);      // 본문 아래·버튼 위에 끼워 넣을 요소(예: 복사용 글상자)
    var actions = el('div', {class:'modal-actions'});
    if(opts.cancelText){
      actions.appendChild(el('button', {class:'btn', text:opts.cancelText, onclick:function(){ closeModal(); focusAnswerInput(true); }}));
    }
    // altText 가 있으면 버튼이 3개가 된다: [취소] [확인(보통 버튼)] [alt(강조 버튼)]
    actions.appendChild(el('button', {class: opts.altText ? 'btn' : 'btn btn-primary', text:opts.confirmText||'확인', onclick:function(){
      closeModal();
      if(opts.onConfirm) opts.onConfirm();
    }}));
    if(opts.altText){
      actions.appendChild(el('button', {class:'btn btn-primary', text:opts.altText, onclick:function(){
        closeModal();
        if(opts.onAlt) opts.onAlt();
      }}));
    }
    box.appendChild(actions);
    var backdrop = el('div', {class:'modal-backdrop', id:'active-modal', onclick:function(e){ if(e.target===backdrop){ closeModal(); focusAnswerInput(true); } }}, [box]);
    root.appendChild(backdrop);
  }
  function closeModal(){
    var m = $('#active-modal');
    if(m) m.remove();
  }

  /* ---------------------------------------------------------
     초기 로드
  --------------------------------------------------------- */
  fetch('data.json').then(function(r){ return r.json(); }).then(function(json){
    DATA = json;
    ALL_Q = DATA.questions || [];
    ALL_Q.forEach(function(q){
      ALL_Q_BY_ID[q.id] = q;
      q._apps = (q.appearances && q.appearances.length) ? q.appearances : [{id:q.id, year:q.year, round:q.round, number:q.display_number}];
      (q.aliases || []).forEach(function(a){ ALL_Q_BY_ID[a] = q; ALIAS_OF[a] = q.id; });
    });
    ROUNDS_META = DATA.rounds_meta || [];
    ROUNDS_META.forEach(function(r){ ROUNDS_META_BY_KEY[r.year+'-'+r.round] = r; });
    LANGS_META = DATA.languages_meta || [];
    REF = (DATA.meta && DATA.meta.ref_source) || null;
    ALL_Q.forEach(function(q){                     // 언어 판이 있는 문항의 기본 판에도 판 key·출처 표시를 달아 둔다
      if(!hasVariants(q)) return;
      q._verKey = 'base';
      q._blog = (q.blog_version === 'base');
      VARIANT_IDS.push(q.id);
    });
    S.langPref = safeLS(function(){
      var v = localStorage.getItem(LANGPREF_KEY);
      return (v === 'Java' || v === 'C') ? v : 'default';
    }, 'default');
    S.count = Math.min(30, ALL_Q.length);
    HIT_COUNT = bumpHitCounter();
    S.memoOpen = safeLS(function(){ return localStorage.getItem(MEMOOPEN_KEY) === '1'; }, false);
    var movedMemos = migrateMemoAliases();         // 합쳐진 문항의 옛 id 로 적은 메모를 남은 문항으로 옮긴다
    $('#loading').hidden = true;
    goHome();
    if(movedMemos > 0) showToast('같은 문제가 여러 회차에 나온 문항을 하나로 합치면서 메모 ' + movedMemos + '개를 남은 문항으로 옮겼습니다.' + (MEMO_TRUNC ? ' (한 메모가 너무 길어져 뒷부분이 잘렸습니다)' : ''), MEMO_TRUNC ? 'bad' : undefined);
    initSync();                                    // 기기 간 동기화(가능한 화면에서만 켜진다)
    initFile();                                    // 기록 파일 폴더 연결 복원(크롬·엣지에서 연결해 둔 경우)
  }).catch(function(err){
    $('#loading').innerHTML = '<div style="color:var(--bad); font-weight:600;">문제 데이터를 불러오지 못했습니다.</div><div style="font-size:12px;color:var(--ink-faint);margin-top:6px;">' + (err && err.message ? err.message : '') + '</div>';
  });

  /* ---------------------------------------------------------
     화면 전환 + 공통 헤더 (ISTQB 사이트와 동일한 패턴)
  --------------------------------------------------------- */
  function showScreen(name){
    memoCommit();
    S.screen = name;
    $('#app').setAttribute('data-screen', name);   // 풀이·결과 화면은 CSS 에서 더 넓게 쓴다
    document.documentElement.setAttribute('data-screen', name);
    ['home','exam','result'].forEach(function(n){
      $('#screen-'+n).hidden = (n!==name);
    });
    document.documentElement.classList.toggle('memo-open', name === 'exam' && !!$('#memo-panel') && !!S.memoOpen);
    window.scrollTo(0,0);
    if(name === 'exam') focusAnswerInput();   // 화면이 보이게 된 '뒤'에 해야 한다(숨겨진 요소에는 포커스가 안 간다)
  }

  function onAppHeaderActivate(){
    if(ALL_Q.length === 0) return;
    if(S.screen === 'exam'){
      confirmExit();
    } else if(S.screen !== 'home'){
      goHome();
    }
  }
  (function(){
    var headerEl = document.getElementById('app-header');
    if(!headerEl) return;
    headerEl.addEventListener('click', onAppHeaderActivate);
    headerEl.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); onAppHeaderActivate(); }
    });
    function syncHeaderHeightVar(){
      var h = headerEl.getBoundingClientRect().height;
      if(h > 0) document.documentElement.style.setProperty('--app-header-h', h + 'px');
    }
    syncHeaderHeightVar();
    if(typeof ResizeObserver !== 'undefined'){
      new ResizeObserver(syncHeaderHeightVar).observe(headerEl);
    } else {
      window.addEventListener('resize', syncHeaderHeightVar);
    }
  })();

  /* ===========================================================
     HOME — 연도/회차 + 언어 이중 필터로 문제 풀 구성
  =========================================================== */
  function matchesFilter(q){
    var roundKeys = Object.keys(S.selectedRounds);
    var langKeys = Object.keys(S.selectedLangs);
    var roundOk = roundKeys.length===0 || appsOf(q).some(function(a){ return S.selectedRounds[appKey(a)]; });   // 어느 한 출제 회차라도 골랐으면 포함
    var langOk = langKeys.length===0 || S.selectedLangs[effLangOf(q)];
    return roundOk && langOk;
  }
  function filteredPool(){
    return ALL_Q.filter(matchesFilter);
  }
  /* 연도별 회차 키 목록. ROUNDS_META는 연도·회차 순으로 정렬돼 있다. */
  function roundKeysOfYear(year){
    return ROUNDS_META.filter(function(r){ return r.year === year; }).map(function(r){ return r.year+'-'+r.round; });
  }
  function allYears(){
    var ys = [];
    ROUNDS_META.forEach(function(r){ if(ys.indexOf(r.year) < 0) ys.push(r.year); });
    return ys;
  }
  function selectAllRounds(){
    S.selectedRounds = {};
    ROUNDS_META.forEach(function(r){ S.selectedRounds[r.year+'-'+r.round] = true; });
    goHome();
  }
  function clearRounds(){
    S.selectedRounds = {};            // 아무것도 고르지 않으면 전체 범위
    goHome();
  }
  /* 그 해의 회차가 모두 선택돼 있으면 모두 해제, 아니면 모두 선택 */
  function toggleYear(year){
    var ks = roundKeysOfYear(year);
    var allOn = ks.length > 0 && ks.every(function(k){ return S.selectedRounds[k]; });
    ks.forEach(function(k){ if(allOn) delete S.selectedRounds[k]; else S.selectedRounds[k] = true; });
    goHome();
  }
  function roundsLabel(){
    var keys = Object.keys(S.selectedRounds);
    if(keys.length===0 || keys.length===ROUNDS_META.length) return '전체 회차';
    var fullYears = [], restKeys = [];
    allYears().forEach(function(y){
      var ks = roundKeysOfYear(y);
      var picked = ks.filter(function(k){ return S.selectedRounds[k]; });
      if(picked.length === ks.length) fullYears.push(y); else restKeys = restKeys.concat(picked);
    });
    var parts = [];
    if(fullYears.length) parts.push(fullYears.join('·') + '년 전체');
    if(restKeys.length){
      if(restKeys.length <= 3) parts.push(restKeys.map(function(k){ var m=ROUNDS_META_BY_KEY[k]; return m?m.label:k; }).join(', '));
      else parts.push(restKeys.length + '개 회차');
    }
    return parts.join(', ');
  }
  /* 출제 순서: 연도 → 회차 → 문제 번호 (데이터가 이미 이 순서지만 정렬을 명시해 데이터 순서에 기대지 않는다).
     여러 회차에 나온 문제는 '고른 범위 안에서 가장 이른 출제 기록'의 자리에 한 번만 놓는다. */
  function orderedPool(){
    return filteredPool().slice().sort(function(a, b){
      return appCmp(leadApp(a), leadApp(b));
    });
  }
  function qLabel(q){ var a = leadApp(q); return a.year + '년 ' + a.round + '회 ' + a.number + '번'; }
  function orderHintText(){
    if(S.shuffle) return '선택한 범위에서 무작위로 뽑아 섞습니다.';
    var p = orderedPool();
    if(p.length === 0) return '';
    var n = Math.max(1, Math.min(S.count, p.length));
    return '오래된 회차부터 문제 번호 순서대로 앞에서 ' + n + '문항을 냅니다: ' + qLabel(p[0]) + ' → ' + qLabel(p[n-1]);
  }
  function langsLabel(){
    var keys = Object.keys(S.selectedLangs);
    if(keys.length===0) return '전체 언어';
    return keys.join('/');
  }

  function goHome(){
    if(S._cfgMode !== undefined){ S.mode = S._cfgMode; S._cfgMode = undefined; }   // 이어서 풀기로 바뀐 모드를 설정값으로 되돌림
    var pool = filteredPool();
    S.countMax = pool.length;
    S.count = Math.min(S.count || Math.min(30,pool.length), Math.max(pool.length,1));
    renderHome();
    showScreen('home');
  }

  /* 처음 화면 아래쪽의 '참고한 웹사이트 · 출처' 블록. data.json meta.ref_source 가 없으면 아무것도 그리지 않는다. */
  function buildRefBox(){
    if(!REF) return null;
    var box = el('div', {class:'ref-box'});
    box.appendChild(el('div', {class:'ref-title', text:'참고한 웹사이트 · 출처'}));

  =========================================================== */
  function startSession(){
    var pool = S.shuffle ? shuffleArr(filteredPool()) : orderedPool();
    pool = pool.slice(0, S.count);
    if(pool.length===0) return;

    S.pool = pool;
    S.idx = 0;
    S.answers = {};
    S.selfMarks = {};
    S.revealed = {};
    S.flagged = {};
    freezeVersions(pool);
    S.startedAt = Date.now();
    S.timeLimitSec = S.timeLimit*60;
    S.remainingSec = S.timeLimitSec;
    S.sourceLabel = roundsLabel() + ' · ' + langsLabel();
    S.sessionId = newSessionId();
    S.result = null;

    if(S.timerHandle){ clearInterval(S.timerHandle); S.timerHandle = null; }
    if(S.timeLimitSec>0){
      S.timerHandle = setInterval(tickTimer, 1000);
    }

    renderExam();
    showScreen('exam');
  }

  function tickTimer(){
    S.remainingSec -= 1;
    updateTimerDisplay();
    if(S.remainingSec<=0){
      clearInterval(S.timerHandle);
      S.timerHandle = null;
      openModal({
        title:'시간이 종료되었습니다',
        body:'제한시간이 모두 지나 자동으로 제출됩니다. 지금까지 답변한 내용으로 채점합니다.',
        confirmText:'결과 보기',
        onConfirm: function(){ submitExam(); }
      });
    }
  }
  function updateTimerDisplay(){
    var t = $('#exam-timer');
    if(!t) return;
    t.textContent = fmtTime(S.remainingSec);
    t.classList.remove('warn','bad');
    if(S.remainingSec<=60) t.classList.add('bad');
    else if(S.remainingSec<=300) t.classList.add('warn');
  }
